/* ==========================================================================
   v3 · tokens.css — 「看起来舒服」+「居中构图」版视觉规范（全片唯一真值来源）
   v3 变化：主视觉与字幕回到画面正中（x=960）；口播框位置不变，用「对称安全列」避让。

         颜色只用 墨黑 / 暖白 / 金 / 紫，红色只在「出问题」时出现；
         动效慢一点、软一点：模糊淡入、逐字打出、卡片带一点纵深，不砸、不震、不闪。

   ========================================================================== */
:root {
  /* ---------- 画布 / 安全区 ---------- */
  --canvas-w: 1920px;
  --canvas-h: 1080px;
  --safe-x: 96px;
  --safe-y: 54px;

  /* ---------- 口播预留框（与 v1 相同：竖屏 9:16，左下） ---------- */
  --slot-w: 280px;
  --slot-h: 498px;
  --slot-x: 96px;
  --slot-y: 528px;          /* 1080 - 54 - 498 */
  --slot-gutter: 40px;

  /* ---------- 构图：以画面正中 x=960 为轴 ----------
     对称安全列：口播框右缘 376 + 留白 40 = 416，镜像到右侧 1504。

  --col-x: 416px;
  --col-r: 1504px;
  --col-w: 1088px;

  /* ---------- 舞台 ---------- */
  --stage-dark: #19181C;       /* 炭黑（不是纯黑，眼睛更松） */
  --stage-light: #FAFAFA;      /* 暖白 */
  --stage-light-edge: #EEEEEE; /* 浅舞台四角轻微压暗，避免「一张白纸」 */

  /* ---------- 墨色 / 文字 ---------- */
  --ink: #141416;              /* 浅舞台主文字 */
  --ink-2: #5E5E66;            /* 浅舞台次文字 */
  --ink-3: #A3A3AA;            /* 浅舞台注释 */
  --paper: #F4F4F2;            /* 深舞台主文字 */
  --paper-2: rgba(244,244,242,0.62);
  --paper-3: rgba(244,244,242,0.36);

  /* ---------- 卡片 ---------- */
  --card-dark: #1F1E23;        /* 深卡（深/浅舞台通用） */
  --card-dark-2: #2A292F;      /* 深卡内的行 */
  --card-light: #FFFFFF;       /* 白卡（只在浅舞台） */
  --card-line-dark: rgba(255,255,255,0.07);
  --card-line-light: rgba(20,20,22,0.07);
  --shadow-on-light: 0 2px 6px rgba(20,20,30,0.06), 0 24px 60px rgba(20,20,30,0.16);
  --shadow-on-dark: 0 24px 60px rgba(0,0,0,0.45);
  --radius: 20px;
  --radius-sm: 12px;
  --radius-pill: 999px;

  /* ---------- 强调色（克制：一屏最多一种） ---------- */
  --gold: #E8B54F;             /* 深舞台强调 */
  --violet: #7B5CF0;           /* 浅舞台强调 */
  --violet-soft: rgba(123,92,240,0.22);
  --red: #E5484D;              /* 只用于「出问题」 */

  /* ---------- 字体 ---------- */
  --font-sans: "SkillSans", "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC",
               "Microsoft YaHei", sans-serif;
  --font-mono: "SkillMono", "JetBrains Mono", "SkillSans", monospace;

  /* 字号层级：一屏只有一个最大的 */
  --fs-hero: 112px;            /* 主句（≤12 字） */
  --fs-title: 76px;            /* 场景标题 */
  --fs-lead: 44px;             /* 副句 */
  --fs-card: 32px;             /* 卡片主文字 */
  --fs-label: 22px;            /* 卡片标签 / 注释 */
  --fs-sub: 34px;              /* 字幕 */
  --tracking-hero: -0.01em;

  /* ---------- 动效 ---------- */
  --ease-soft: cubic-bezier(0.16, 1, 0.3, 1);   /* 柔和的 expo-out，主曲线 */
  --ease-io: cubic-bezier(0.65, 0, 0.35, 1);    /* 舞台切换 */
  --dur-in: 650ms;
  --dur-out: 450ms;
  --type-step: 55ms;           /* 逐字间隔 */
}

<style>/* styles/base.css */
/* ==========================================================================
   ch02 · base.css — 舞台、深/浅背景、字幕条、章节角标、口播框、参考线、播放器
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
body { -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }

#stage {
  position: absolute; left: 0; top: 0;
  width: var(--canvas-w); height: var(--canvas-h);
  transform-origin: 0 0;
  overflow: hidden;
  background: var(--stage-dark);
  font-family: var(--font-sans);
  font-feature-settings: normal;   /* 不挤压标点：逗号、问号留足呼吸 */
  color: var(--ink);
}
.layer { position: absolute; inset: 0; pointer-events: none; }

/* ---------- 深 / 浅两种舞台（引擎按场景交叉切换 #bg-light 的透明度） ---------- */
#bg-dark {
  background:
    radial-gradient(900px 600px at 64% 40%, rgba(255,255,255,0.035), transparent 70%),
    radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.35) 100%),
    var(--stage-dark);
}
#bg-light {
  background:
    radial-gradient(1400px 900px at 60% 45%, var(--stage-light) 55%, var(--stage-light-edge) 100%);
  opacity: 0;
}

/* ---------- 场景 ---------- */
.scene { position: absolute; inset: 0; }
.scene > .cam { position: absolute; inset: 0; transform-origin: 960px 520px; perspective: 1800px; perspective-origin: 960px 480px; }
.scene.is-dark  { color: var(--paper); }
.scene.is-light { color: var(--ink); }
.scene .persp { perspective: 1800px; }

/* ---------- 字幕条：黑底小圆角，白字，主视觉列底部居中 ---------- */
#subs .sub-row {
  position: absolute; left: var(--col-x); width: var(--col-w);   /* 以 960 为中心 */
  bottom: 62px;
  display: flex; justify-content: center;
}
#subs .sub {
  padding: 8px 18px 9px;
  border-radius: 8px;
  background: rgba(14,14,16,0.92);
  color: #fff;
  font-size: var(--fs-sub);
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: 0.03em;
  font-feature-settings: normal;
  white-space: nowrap;
}
.no-subs #subs { display: none; }

/* ---------- 章节角标：数字小方块 + 标题（参考「翻页数字」） ---------- */
.chapter {
  position: absolute; left: var(--safe-x); top: var(--safe-y);
  display: flex; align-items: center; gap: 8px;
}
.chapter .digit {
  width: 40px; height: 54px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--card-dark); color: #fff;
  font-family: var(--font-sans); font-size: 34px; font-weight: 900;
  box-shadow: inset 0 -27px 0 rgba(255,255,255,0.03), 0 6px 16px rgba(0,0,0,0.18);
}
.chapter .title {
  margin-left: 14px;
  font-size: 34px; font-weight: 900; letter-spacing: 0.02em;
}
/* 右上角系列标记 */
.series {
  position: absolute; right: var(--safe-x); top: calc(var(--safe-y) + 12px);
  display: flex; align-items: center; gap: 10px;
  font-size: 22px; font-weight: 700; letter-spacing: 0.08em;
}
.series i { width: 9px; height: 9px; border-radius: 50%; background: var(--violet); }

/* ---------- 口播预留框 ---------- */
.slot {
  position: absolute;
  left: var(--slot-x); top: var(--slot-y); width: var(--slot-w); height: var(--slot-h);
  border-radius: var(--radius);
  background: var(--card-dark);
  border: 1px solid var(--card-line-dark);
  box-shadow: var(--shadow-on-light);
  overflow: hidden;
}
.slot .corner { position: absolute; width: 20px; height: 20px; border: 0 solid rgba(255,255,255,0.28); }
.slot .corner.tl { left: 16px; top: 16px; border-left-width: 2px; border-top-width: 2px; border-top-left-radius: 6px; }
.slot .corner.tr { right: 16px; top: 16px; border-right-width: 2px; border-top-width: 2px; border-top-right-radius: 6px; }
.slot .corner.bl { left: 16px; bottom: 16px; border-left-width: 2px; border-bottom-width: 2px; border-bottom-left-radius: 6px; }
.slot .corner.br { right: 16px; bottom: 16px; border-right-width: 2px; border-bottom-width: 2px; border-bottom-right-radius: 6px; }
.slot .info {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.slot .info svg { width: 48px; height: 48px; opacity: 0.35; }
.slot .info .t { font-size: 24px; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.14em; }
.slot .info .m { font-family: var(--font-mono); font-size: 16px; color: rgba(255,255,255,0.3); line-height: 1.6; text-align: center; }
.slot .name {
  position: absolute; left: 28px; bottom: 44px;
  padding: 5px 14px 6px; border-radius: var(--radius-pill);
  background: #fff; color: var(--ink);
  font-size: 19px; font-weight: 800; letter-spacing: 0.08em;
}
/* 口播视频：铺满窗口（已在 ffmpeg 里按 540×960@(282,14) 裁成 9:16） */
.slot .vo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #d9d8dc; }
.slot:has(.vo) .corner, .slot:has(.vo) .info { display: none; }
/* 导出模式：视频由 ffmpeg 叠加，HTML 只画窗口外框与投影；名牌也由叠加层负责 */
.capture .slot .vo { display: none; }
.capture .slot .name { display: none; }
.capture .slot { background: #1F1E23; }
/* 有声播放的开始按钮 */
#start {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: rgba(10,10,12,0.55); backdrop-filter: blur(6px); cursor: pointer;
  font: 800 28px/1.4 "SkillSans", sans-serif; color: #fff; letter-spacing: 0.06em;
}
#start span { padding: 18px 34px; border-radius: 999px; background: #fff; color: #141416; }
#start small { display: block; margin-top: 14px; font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.7); text-align: center; }
body.capture #start { display: none; }
.slot-key .slot { background: #00FF00; border-color: transparent; box-shadow: none; }
.slot-key .slot > *:not(.name) { display: none; }
.slot-alpha .slot { background: transparent; border-color: transparent; box-shadow: none; }
.slot-alpha .slot > *:not(.name) { display: none; }

/* ---------- 参考线 ---------- */
#guides { display: none; }
.show-guides #guides { display: block; }
#guides .g-safe { position: absolute; left: 96px; top: 54px; right: 96px; bottom: 54px; outline: 1px dashed rgba(56,189,248,0.8); }
#guides .g-main { position: absolute; left: var(--col-x); width: var(--col-w); top: 54px; bottom: 54px; background: rgba(56,189,248,0.05); outline: 1px solid rgba(56,189,248,0.4); }
#guides .g-axis { position: absolute; left: 959px; width: 2px; top: 54px; bottom: 54px; background: rgba(56,189,248,0.5); }
#guides .g-zone {
  position: absolute; left: 0; top: calc(var(--slot-y) - var(--slot-gutter));
  width: calc(var(--slot-x) + var(--slot-w) + var(--slot-gutter)); bottom: 0;
  background: repeating-linear-gradient(45deg, rgba(229,72,77,0.16) 0 6px, transparent 6px 16px);
  outline: 1px dashed rgba(229,72,77,0.8);
}
#guides .g-label { position: absolute; font: 15px/1.4 var(--font-mono); color: #38BDF8; background: rgba(0,0,0,0.65); padding: 2px 8px; }

/* ---------- 播放器（舞台外，不进成片） ---------- */
#player {
  position: fixed; left: 50%; bottom: 18px; translate: -50% 0;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 14px;
  background: rgba(24,24,28,0.88); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  font: 500 13px/1 "SkillMono", ui-monospace, monospace; color: #ccc;
  z-index: 10; transition: opacity .4s; user-select: none;
}
#player button {
  background: #fff; color: #111; border: 0; border-radius: 8px;
  font: 700 13px/1 inherit; font-family: inherit; padding: 8px 12px; cursor: pointer;
}
#player button.ghost { background: transparent; color: #ccc; border: 1px solid rgba(255,255,255,0.16); }
#player input[type=range] { width: 380px; accent-color: #7B5CF0; }
#player .time { min-width: 110px; text-align: right; }
body.idle #player { opacity: 0; }
body.capture #player, body.capture #lint { display: none !important; }
#lint {
  position: fixed; right: 12px; top: 12px; max-width: 440px; z-index: 11;
  font: 12px/1.5 ui-monospace, monospace; color: #E5484D;
  background: rgba(0,0,0,0.82); padding: 8px 10px; border-radius: 8px; display: none;
}

/* ---------- 导出用叠加层（tools/render.mjs overlay 模式，透明背景截图） ---------- */
body.ov #stage { background: transparent !important; }
body.ov .layer:not(#slot) { display: none !important; }
body.ov .slot { box-shadow: none !important; border-color: transparent !important; background: transparent !important; }
body.ov .slot > * { display: none !important; }
body.ov-name .slot > .name { display: block !important; }
body.ov-mask .slot { background: #fff !important; }
html:has(body.ov), body.ov { background: transparent !important; }
</style>
<style>/* styles/components.css */
/* ==========================================================================
   v3 · components.css — 可复用组件（与具体场景无关）
   .c-*  组件；深/浅舞台由场景类 .is-dark / .is-light 自动适配
   ========================================================================== */

/* ---------- 主句 / 标题（逐字打出用 .c-type） ---------- */
.c-hero {
  font-size: var(--fs-hero); font-weight: 900; line-height: 1.12;
  letter-spacing: var(--tracking-hero); white-space: nowrap;
}
.c-title {
  font-size: var(--fs-title); font-weight: 900; line-height: 1.15;
  letter-spacing: var(--tracking-hero); white-space: nowrap;
}
.c-lead {
  display: inline-block;
  font-size: var(--fs-lead); font-weight: 700; line-height: 1.3; letter-spacing: 0.02em;
  white-space: nowrap;
}
.is-dark .c-lead { color: var(--paper-2); }
.is-light .c-lead { color: var(--ink-2); }
/* 强调词：深舞台金色，浅舞台紫色 */
.is-dark em  { font-style: normal; color: var(--gold); }
.is-light em { font-style: normal; color: var(--violet); }
.c-type .ch { display: inline-block; white-space: pre; }
.mono { font-family: var(--font-mono); letter-spacing: -0.01em; }

/* 紫色荧光笔：<span class="c-mark">…<i class="hl"></i></span> */
.c-mark { position: relative; display: inline-block; isolation: isolate; }
.c-mark > .hl {
  position: absolute; left: -6px; right: -6px; bottom: 0.06em; height: 0.46em;
  background: var(--violet-soft); border-radius: 6px; z-index: -1;
  transform-origin: 0 50%;
}

/* ---------- 胶囊 ---------- */
.c-pill {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 28px 13px; border-radius: var(--radius-pill);
  font-size: 34px; font-weight: 900; letter-spacing: 0.03em; line-height: 1;
  white-space: nowrap;
  background: var(--ink); color: #fff;
  box-shadow: 0 10px 24px rgba(20,20,30,0.18);
}
.c-pill em { color: #A891FF !important; }
.c-pill.is-sm { font-size: 22px; padding: 7px 16px 8px; font-weight: 800; box-shadow: none; }
.c-pill.is-white { background: #fff; color: var(--ink); }
.c-pill.is-ghost { background: transparent; color: inherit; border: 1.5px solid currentColor; opacity: .55; box-shadow: none; }

/* ---------- 卡片 ---------- */
.c-card {
  position: absolute;
  border-radius: var(--radius);
  background: var(--card-dark); color: var(--paper);
  border: 1px solid var(--card-line-dark);
}
.is-dark .c-card  { box-shadow: var(--shadow-on-dark); }
.is-light .c-card { box-shadow: var(--shadow-on-light); }
.c-card.is-white { background: var(--card-light); color: var(--ink); border-color: var(--card-line-light); }
.c-card .head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 26px 30px 0;
  font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.06em; color: var(--paper-3);
}
.c-card.is-white .head { color: var(--ink-3); }
.c-card .body { padding: 22px 30px 30px; }

/* 卡片里的行：占位（虚线）→ 填入 */
.c-row {
  position: relative;
  display: flex; align-items: center; gap: 16px;
  height: 62px; padding: 0 20px; margin-bottom: 12px;
  border-radius: var(--radius-sm);
  background: var(--card-dark-2);
  font-size: var(--fs-card); font-weight: 800; letter-spacing: 0.02em;
}
.c-row:last-child { margin-bottom: 0; }
.c-row.is-slot { background: transparent; outline: 1.5px dashed rgba(255,255,255,0.12); outline-offset: -1.5px; }
.c-row .no { font-family: var(--font-mono); font-size: 22px; font-weight: 800; color: var(--gold); width: 34px; }
.c-row .k { font-size: 24px; font-weight: 700; color: var(--paper-3); width: 64px; flex: none; }
.c-row .v { flex: 1; }
.c-row.is-bad .v { color: var(--red); }
.c-row .fill { display: flex; align-items: center; gap: 16px; }

/* 骨架条（表示「正文」，不给可读文字，避免和字幕抢视线） */
.c-skel { height: 16px; border-radius: 8px; background: #ECECEF; margin: 14px 0; }
.is-dark .c-skel, .c-card:not(.is-white) .c-skel { background: rgba(255,255,255,0.08); }

/* ---------- 小圆徽标：对勾 / 叉 ---------- */
.c-badge {
  position: absolute; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--ink); color: #fff;
  box-shadow: 0 0 0 4px var(--stage-light), 0 6px 14px rgba(0,0,0,0.2);
}
.is-dark .c-badge { background: #fff; color: var(--ink); box-shadow: 0 0 0 4px var(--stage-dark); }
.c-badge.is-red { background: var(--red); color: #fff; }
.c-badge svg { width: 22px; height: 22px; }

/* ---------- 文件 / 文件夹图标 ---------- */
.ico { width: 34px; height: 34px; flex: none; }

/* ---------- 方块（四件套） ---------- */
.c-tile {
  position: absolute; width: 300px; height: 210px;
  border-radius: var(--radius);
  background: var(--card-dark); color: var(--paper);
  box-shadow: var(--shadow-on-light);
  padding: 28px 28px 26px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.c-tile .file { display: flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-size: 27px; font-weight: 700; }
.c-tile .role { font-size: 40px; font-weight: 900; letter-spacing: 0.02em; }
.c-tile .tag { position: absolute; right: 24px; bottom: 34px; }

/* ==========================================================================
   v3 新增：同一张卡上的「变化」
   ========================================================================== */
/* 状态容器：子元素 [data-state] 叠在同一格，引擎用 fx:'state' 在它们之间过渡。
   用法：<div class="c-morph"><div data-state="a">…</div><div data-state="b">…</div></div> */
.c-morph { display: inline-grid; }
.c-morph > [data-state] { grid-area: 1 / 1; justify-self: center; align-self: center; }
.c-morph.is-start > [data-state] { justify-self: start; }
.c-morph.is-block { display: grid; width: 100%; }

/* 会变形的卡：尺寸 / 位置由引擎 fx:'move' 驱动，内容被裁在卡内 */
.c-card.is-morph { overflow: hidden; }
.c-card .face { position: absolute; inset: -1px; border-radius: inherit; }

/* 文件行（文件夹卡里的一行） */
.c-file {
  display: flex; align-items: center; gap: 18px;
  height: 84px; padding: 0 24px; margin-bottom: 12px;
  border-radius: 14px; background: var(--card-dark-2);
  font-family: var(--font-mono); font-size: 34px; font-weight: 800; letter-spacing: -0.01em;
  white-space: nowrap;
}
.c-file .ico { width: 40px; height: 40px; }
.c-file .role { margin-left: auto; font-family: var(--font-sans); font-size: 28px; font-weight: 800; color: var(--paper-2); letter-spacing: 0.04em; }
.c-file .c-pill { margin-left: 14px; }
.c-file.is-opt { background: transparent; outline: 1.5px solid rgba(255,255,255,0.08); outline-offset: -1.5px; }
.c-file.is-opt .name { color: var(--paper-2); }

/* 小任务芯片（白卡，浅舞台） */
.c-chip {
  position: absolute; display: flex; align-items: center; gap: 14px;
  height: 72px; padding: 0 22px; border-radius: 16px;
  background: #fff; color: var(--ink); box-shadow: var(--shadow-on-light);
  font-size: 28px; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap;
}
.c-chip .ok { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; }
.c-chip .ok svg { width: 18px; height: 18px; }
.c-chip .arrow { color: var(--ink-3); font-family: var(--font-mono); font-size: 24px; }
</style>
<style>/* styles/scenes.css */
/* ==========================================================================
   ch07 · scenes.css — 第七章「值不值得做 + 总结」（全片最后一章）
   构图沿用前几章：中轴 x=960；与口播框同高区域（y>488）只用 416→1504；浅舞台。

.l-at { position: absolute; }

.hero-wrap .c-hero { font-size: 112px; }
.is-light em.red { color: var(--red); }
.row-c { position: absolute; left: 0; width: 1920px; display: flex; justify-content: center; align-items: center; gap: 14px; }
.row-c .c-chip { position: static; }
.c-skel.l { background: #ECECEF; height: 14px; margin: 14px 0 0; }

/* 小方块（适合 / 不适合） */
.tile { position: absolute; width: 430px; height: 96px; display: flex; align-items: center; gap: 14px; padding: 0 26px; font-size: 27px; font-weight: 800; white-space: nowrap; }

.c-card.tile:not(.is-white) .c-badge:not(.is-red) { background: #fff; color: var(--ink); }

/* ---------- 部分 A · 什么任务值得做 ---------- */
#pA-worth .crit { top: 296px; }

<script>/* js/engine.js */
/* ==========================================================================
   ch07 · engine.js — 复制自 src-ch06（含字幕淡出 80ms；时长下限 45s）
   和 v3 的区别：
     · 部分用绝对时间 span:[起, 止]，cue 的 at 也是「章节内绝对秒数」，直接对齐真实口播
     · 字幕来自 Studio.TIMELINE（tools/align.py 生成：文案正文 + Whisper 逐字时间）
     · 口播视频 <video id="vo"> 是播放时的主时钟（声画同步）；导出时不渲染视频，
       由 tools/compose_ch01.sh 用同一份裁切视频叠进口播窗口
   ------------------------------------------------------------------------
   以下为 v3 引擎说明：
   --------------------------------------------------------------------------
   v3 的核心变化：「出现 - 变化 - 消失 - 出现」
     · 时间轴由若干「部分（part）」组成，每部分 12–18 秒。
     · 部分内部 **不换卡**：同一组元素持续停在舞台上，通过「变化」推进——
         state  标题 / 卡头 / 行文字在原位从一个状态过渡到下一个状态
         move   卡片移动、缩放、变形（位置、尺寸、透明度）
         fill   占位行被填满      mark  荧光笔划过      badge  打 √ / ×
     · 只有部分结束时，整组才虚化退场，下一部分的卡片再进场。
   所有动画用 Web Animations API 创建后暂停，由主时钟统一 seek → HTML 与逐帧导出完全一致。

   部分定义：{ id, stage:'dark'|'light', chapter:{no,title}, duration, html, cues[], subs[] }
   cue：{ at: 秒(相对部分), sel, fx, stagger?, to? }
     fx:'state' → to: 'b'（切到 [data-state="b"]）
     fx:'move'  → to: { x, y, w, h, o, s }（left/top/width/height/opacity/scale，任选）
   URL：?t= ?capture=1 ?guides=1 ?subs=0 ?slot=key|alpha ?loop=1 ?autoplay=0
   ========================================================================== */
(function () {
  'use strict';
  const S = (window.Studio = window.Studio || {});
  S.version = 3;
  S.scenes = [];
  S.scene = (def) => S.scenes.push(def);
  S.FPS = 30;
  S.EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
  S.EASE_IO = 'cubic-bezier(0.65, 0, 0.35, 1)';
  S.RULES = {
    duration: [45, 120],     // 一章的时长（ch05 口播本身只有 55.6s，下限放宽到 45s）
    part: [6, 75],           // 每部分 6–75s（一个小节 = 一个部分，SKILL.md 小节约 71s）
    minChanges: 2,           // 每部分至少 2 次「变化」
    heroMax: 14,
    axis: 960,               // 构图中轴
    col: [416, 1504],        // 对称安全列（口播框同高区域）
  };
  S.config = { slot: {}, series: 'Skill 入门' };
  const CHANGE_FX = ['state', 'move', 'fill', 'fillLight', 'mark', 'badge', 'recede', 'restore', 'unbadge'];

  /* ------------------------------------------------------------------
     动效预设 → [target, keyframes, ms, opts?][]
     预设签名 (el, cue, ctx)；ctx 记录每个元素「当前状态 / 当前盒子」，
     以便 state / move 从上一个状态接着变，而不是重新出现。
     ------------------------------------------------------------------ */
  const IN_KF = [{ opacity: 0, translate: '0 24px', filter: 'blur(10px)' }, { opacity: 1, translate: '0 0', filter: 'blur(0px)' }];
  const OUT_KF = [{ opacity: 1, translate: '0 0', filter: 'blur(0px)' }, { opacity: 0, translate: '0 -16px', filter: 'blur(10px)' }];
  const charsIn = (root, delay0 = 0) => [...root.querySelectorAll('.ch')].map((ch, i) => [ch, [
    { opacity: 0, translate: '0 0.22em', filter: 'blur(6px)' },
    { opacity: 1, translate: '0 0', filter: 'blur(0px)' }], 420, { delay: delay0 + i * 50 }]);

  const fx = (S.fx = {
    in: (el) => [[el, IN_KF, 650]],
    soft: (el) => [[el, [{ opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)' }], 550]],
    tilt: (el) => [[el, [
      { opacity: 0, translate: '0 60px', rotate: '1 0 0 22deg', filter: 'blur(6px)' },
      { opacity: 1, translate: '0 0', rotate: '1 0 0 0deg', filter: 'blur(0px)' }], 850]],
    type: (el) => charsIn(el),
    badge: (el) => [[el, [{ opacity: 0, scale: '0.4' }, { opacity: 1, scale: '1' }], 480,
      { easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }]],
    unbadge: (el) => [[el, [{ opacity: 1, scale: '1' }, { opacity: 0, scale: '0.4' }], 300, { easing: S.EASE_IO }]],
    mark: (el) => [[el.querySelector('.hl') || el, [{ scale: '0 1' }, { scale: '1 1' }], 600]],
    fill: (el) => [
      [el, [{ backgroundColor: 'rgba(42,41,47,0)' }, { backgroundColor: 'rgba(42,41,47,1)' }], 500],
      [el.querySelector('.fill') || el, [
        { opacity: 0, translate: '-14px 0', filter: 'blur(6px)' },
        { opacity: 1, translate: '0 0', filter: 'blur(0px)' }], 550],
    ],
    // 白卡上的占位行被填满（浅紫底 + 内容浮现）
    fillLight: (el) => [
      [el, [{ backgroundColor: 'rgba(123,92,240,0)', outlineColor: 'rgba(20,20,22,0.14)' }, { backgroundColor: 'rgba(123,92,240,0.07)', outlineColor: 'rgba(123,92,240,0)' }], 500],
      [el.querySelector('.fill') || el, [
        { opacity: 0, translate: '-14px 0', filter: 'blur(6px)' },
        { opacity: 1, translate: '0 0', filter: 'blur(0px)' }], 550],
    ],
    // 从「退后」恢复
    restore: (el) => [[el, [{ opacity: 0.35, filter: 'blur(2px)' }, { opacity: 1, filter: 'blur(0px)' }], 600]],
    recede: (el) => [[el, [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0.35, filter: 'blur(2px)' }], 600]],
    out: (el) => [[el, [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(12px)' }], 450, { easing: S.EASE_IO }]],

    // —— 变化：原位换状态（旧状态上飘虚化，新状态从下方浮现；带 .c-type 的逐字打出）——
    state: (el, cue, ctx) => {
      const kids = [...el.children].filter((k) => k.dataset.state);
      const cur = ctx.state.get(el) ?? kids[0].dataset.state;
      const from = kids.find((k) => k.dataset.state === cur);
      const to = kids.find((k) => k.dataset.state === cue.to);
      if (!to) throw new Error(`state: 找不到 [data-state="${cue.to}"]`);
      ctx.state.set(el, cue.to);
      const list = [[from, OUT_KF, 380, { easing: S.EASE_IO }]];
      if (to.querySelector('.ch')) {
        list.push([to, [{ opacity: 0 }, { opacity: 1 }], 1, { delay: 200, easing: 'linear' }]);
        list.push(...charsIn(to, 200));
      } else list.push([to, IN_KF, 600, { delay: 200 }]);
      return list;
    },
    // —— 变化：移动 / 缩放 / 变形 ——
    move: (el, cue, ctx) => {
      const a = ctx.box.get(el);
      const b = { ...a, ...cue.to };
      ctx.box.set(el, b);
      const k = (v) => ({ left: v.x + 'px', top: v.y + 'px', width: v.w + 'px', height: v.h + 'px', opacity: v.o, scale: String(v.s) });
      return [[el, [k(a), k(b)], cue.dur || 900, { easing: S.EASE }]];
    },

    // —— 内部 ——
    show: (el) => [[el, [{ opacity: 0 }, { opacity: 1 }], 1, { easing: 'linear' }]],
    hide: (el) => [[el, [{ opacity: 0 }, { opacity: 0 }], 1, { easing: 'linear' }]],
    subIn: (el) => [[el, [{ opacity: 0, translate: '0 8px' }, { opacity: 1, translate: '0 0' }], 300]],
    subOut: (el) => [[el, [{ opacity: 1 }, { opacity: 0 }], 80, { easing: 'linear' }]],   // ch04：80ms，减少换行时两条字幕叠在一起
  });

  /* ------------------------------------------------------------------ */
  const $ = (s, r = document) => r.querySelector(s);
  const params = new URLSearchParams(location.search);
  const anims = [];
  const touched = new WeakSet();
  const ctx = { state: new Map(), box: new Map() };
  S.lint = [];
  S.t = 0;
  S.playing = false;

  function addAnim(target, keyframes, durMs, absSec, o = {}) {
    const fill = o.fill || (touched.has(target) ? 'forwards' : 'both');
    touched.add(target);
    const a = target.animate(keyframes, {
      duration: durMs, delay: absSec * 1000 + (o.delay || 0), fill,
      easing: o.easing || S.EASE, iterations: o.iterations || 1,
    });
    a.pause();
    anims.push(a);
  }
  function runFx(c) {
    if (!fx[c.fx]) { S.lint.push(`未知动效 fx="${c.fx}"`); return; }
    try { fx[c.fx](c.el, c.cue || {}, ctx).forEach(([t, kf, d, o]) => addAnim(t, kf, d, c.abs, o)); }
    catch (e) { S.lint.push(`${c.fx}: ${e.message}`); }
  }

  /* ------------------------------------------------------------------
     构建
     ------------------------------------------------------------------ */
  function buildDom() {
    let t = 0;
    S.scenes.forEach((def) => {
      if (def.span) { if (Math.abs(def.span[0] - t) > 0.001) S.lint.push(`[${def.id}] span 起点 ${def.span[0]} 与上一部分终点 ${t} 不衔接`); def.duration = def.span[1] - def.span[0]; }
      const sec = document.createElement('section');
      sec.className = `scene is-${def.stage || 'light'}`;
      sec.id = def.id;
      sec.innerHTML = `<div class="cam">${def.html}</div>`;
      $('#scenes').appendChild(sec);
      Object.assign(def, { el: sec, start: t, end: t + def.duration });
      t += def.duration;
    });
    S.duration = t;
  }

  // 记录会被 move 的元素的初始盒子（必须在创建任何动画之前读）
  function readBoxes() {
    S.scenes.forEach((def) => (def.cues || []).filter((c) => c.fx === 'move').forEach((c) => {
      def.el.querySelectorAll(c.sel).forEach((el) => {
        if (ctx.box.has(el)) return;
        const cs = getComputedStyle(el);
        const sc = parseFloat(cs.scale); // CSS 里写了 scale 的元素，从那个值开始变
        ctx.box.set(el, { x: parseFloat(cs.left), y: parseFloat(cs.top), w: el.offsetWidth, h: el.offsetHeight, o: 1, s: isNaN(sc) ? 1 : sc });
      });
    }));
  }

  const STAGE_TEXT = { dark: '#F4F4F2', light: '#141416' };

  function buildTimeline() {
    const cues = [];
    const last = S.scenes[S.scenes.length - 1];

    // 章节角标（先建 DOM，舞台切换时要跟着变色）
    const groups = [];
    S.scenes.forEach((def) => {
      const key = def.chapter ? def.chapter.no + '|' + def.chapter.title : '';
      const g = groups[groups.length - 1];
      if (g && g.key === key) g.end = def.end;
      else groups.push({ key, chapter: def.chapter, start: def.start, end: def.end });
    });
    groups.forEach((g, i) => {
      if (!g.chapter) return;
      const d = document.createElement('div');
      d.className = 'chapter';
      d.innerHTML = [...g.chapter.no].map((n) => `<span class="digit">${n}</span>`).join('') +
        `<span class="title adapt">${g.chapter.title}</span>`;
      $('#chapters').appendChild(d);
      cues.push({ abs: g.start + 0.1, el: d, fx: 'in' });
      if (i < groups.length - 1) cues.push({ abs: g.end - 0.45, el: d, fx: 'out' });
    });

    S.scenes.forEach((def, i) => {
      const prev = S.scenes[i - 1];
      cues.push({ abs: def.start, el: def.el, fx: 'show' });
      if (def !== last || def.outro) cues.push({ abs: def.end - 0.45, el: def.el, fx: 'out' });   // 部分结束才整体退场

      addAnim(def.el.querySelector('.cam'), [{ scale: '1' }, { scale: '1.02' }], def.duration * 1000, def.start, { easing: 'linear' });

      const stage = def.stage || 'light';
      const from = prev ? prev.stage || 'light' : stage;
      if (!prev || from !== stage) {
        const t0 = prev ? def.start - 0.6 : 0;
        const dur = prev ? 1400 : 1;
        addAnim($('#bg-light'), [{ opacity: from === 'light' ? 1 : 0 }, { opacity: stage === 'light' ? 1 : 0 }], dur, t0, { easing: S.EASE_IO });
        document.querySelectorAll('.adapt').forEach((el) =>
          addAnim(el, [{ color: STAGE_TEXT[from] }, { color: STAGE_TEXT[stage] }], dur, t0, { easing: S.EASE_IO }));
      }

      // 状态容器：除第一个状态外，开场即隐藏
      def.el.querySelectorAll('.c-morph').forEach((m) =>
        [...m.children].filter((k) => k.dataset.state).slice(1).forEach((k) => cues.push({ abs: 0, el: k, fx: 'hide', pre: true })));

      (def.cues || []).forEach((c) => {
        const els = def.el.querySelectorAll(c.sel);
        if (!els.length) S.lint.push(`[${def.id}] 选择器没有命中：${c.sel}`);
        const base = def.span ? 0 : def.start;      // span 部分：at 为章节绝对时间
        els.forEach((el, k) => cues.push({ abs: base + c.at + (c.stagger || 0) * k, el, fx: c.fx, cue: c, part: def }));
      });

      (def.subs || []).forEach((s) => {
        const row = document.createElement('div');
        row.className = 'sub-row';
        row.innerHTML = `<div class="sub"></div>`;
        row.firstChild.textContent = s.text;
        $('#subs').appendChild(row);
        cues.push({ abs: def.start + s.from, el: row, fx: 'subIn' });
        cues.push({ abs: def.start + s.to, el: row, fx: 'subOut' });
      });
    });

    // pre（hide）排在最前；其余按时间
    // 全章字幕（绝对时间）
    ((S.TIMELINE && S.TIMELINE.subs) || []).forEach((s) => {
      const row = document.createElement('div');
      row.className = 'sub-row';
      row.innerHTML = `<div class="sub"></div>`;
      row.firstChild.textContent = s.text;
      $('#subs').appendChild(row);
      cues.push({ abs: s.from, el: row, fx: 'subIn' });
      cues.push({ abs: s.to, el: row, fx: 'subOut' });
    });
    // 全局 cue（口播框名牌等）
    (S.globalCues || []).forEach((c) => document.querySelectorAll(c.sel).forEach((el) => cues.push({ abs: c.at, el, fx: c.fx, cue: c })));

    cues.sort((a, b) => (b.pre ? 1 : 0) - (a.pre ? 1 : 0) || a.abs - b.abs).forEach(runFx);
    S._cues = cues;
  }

  /* ------------------------------------------------------------------
     校验
     1) 时长 / 每部分时长 / 每部分至少 N 次「变化」
     2) 逐帧版式审计：每 0.25s 采样一次，凡是可见（累计不透明度 > 0.08）的
        大字、卡片、胶囊、芯片、徽标、字幕，都不能进入口播禁区、不能越出安全区；
        字幕和标题的中心必须在 x=960 ±4px。
     ------------------------------------------------------------------ */
  const AUDIT = '.scene .c-card, .scene .c-title, .scene .c-hero, .scene .c-lead, .scene .c-pill, .scene .c-chip, .scene .c-badge, #subs .sub';
  function effOpacity(el) {
    let o = 1;
    for (let n = el; n && n.id !== 'stage'; n = n.parentElement) o *= parseFloat(getComputedStyle(n).opacity);
    return o;
  }
  function lint(zone) {
    const R = S.RULES;
    if (S.duration < R.duration[0] || S.duration > R.duration[1]) S.lint.push(`总时长 ${S.duration}s 不在 ${R.duration.join('–')}s`);
    S.scenes.forEach((d) => {
      if (d.duration < R.part[0] || d.duration > R.part[1]) S.lint.push(`[${d.id}] 部分时长 ${d.duration}s 不在 ${R.part.join('–')}s`);
      const t0 = d.span ? d.span[0] : 0;
      const changes = (d.cues || []).filter((c) => CHANGE_FX.includes(c.fx) && c.at - t0 > 1.5).length;
      if (changes < R.minChanges) S.lint.push(`[${d.id}] 部分内部只有 ${changes} 次变化（应 ≥${R.minChanges}）：会退化成「出现-消失-出现」`);
      const subs = (d.subs || []).slice().sort((a, b) => a.from - b.from);
      subs.forEach((s, i) => { if (subs[i + 1] && subs[i + 1].from < s.to) S.lint.push(`[${d.id}] 字幕重叠：${s.text}`); });
    });
    const gs = ((S.TIMELINE && S.TIMELINE.subs) || []);
    gs.forEach((s, i) => {
      if (gs[i + 1] && gs[i + 1].from < s.to) S.lint.push(`字幕重叠：${s.text}`);
      if (s.to - s.from < 0.5) S.lint.push(`字幕停留太短（${(s.to - s.from).toFixed(2)}s）：${s.text}`);
    });
    document.querySelectorAll('.scene .c-hero, .scene .c-title').forEach((h) => {
      const n = h.textContent.replace(/\s/g, '').length;
      if (n > R.heroMax) S.lint.push(`主句「${h.textContent.trim()}」${n} 字 > ${R.heroMax}`);
    });

    const seen = new Set();
    const els = [...document.querySelectorAll(AUDIT)];
    for (let t = 0; t <= S.duration; t += 0.25) {
      S.seek(t);
      els.forEach((el) => {
        if (effOpacity(el) < 0.08) return;
        const r = rectOf(el);
        const tag = (el.closest('.scene')?.id || 'subs') + ' ' + el.className.split(' ').slice(0, 2).join('.');
        const bad = (msg) => { const k = tag + msg; if (!seen.has(k)) { seen.add(k); S.lint.push(`${msg}：${tag} @t=${t.toFixed(2)} (${r.x | 0},${r.y | 0} ${r.w | 0}×${r.h | 0})`); } };
        if (r.x < zone.r && r.x + r.w > zone.x && r.y < zone.b && r.y + r.h > zone.y) bad('进入口播禁区');
        if (r.x < 94 || r.y < 52 || r.x + r.w > 1826 || r.y + r.h > 1028) bad('越出安全区');
        const centred = el.matches('#subs .sub') || el.closest('.ttl');
        if (centred && Math.abs(r.x + r.w / 2 - R.axis) > 4) bad('没有居中');
      });
    }
    S.seek(0);
    if (S.lint.length) {
      const box = $('#lint');
      if (box) { box.style.display = 'block'; box.innerHTML = '<b>LINT</b><br>' + S.lint.map((s) => '· ' + s).join('<br>'); }
      S.lint.forEach((m) => console.warn('[lint]', m));
    }
  }

  /* ------------------------------------------------------------------
     时钟
     ------------------------------------------------------------------ */
  S.seek = (t) => {
    S.t = Math.max(0, Math.min(S.duration, t));
    const ms = S.t * 1000;
    for (let i = 0; i < anims.length; i++) anims[i].currentTime = ms;
    S.onTick && S.onTick(S.t);
  };
  S.frame = (t) => new Promise((res) => { S.seek(t); requestAnimationFrame(() => requestAnimationFrame(res)); });
  // 口播视频作为主时钟：播放时 t = video.currentTime（视频结束后改用墙钟走完片尾）
  const vo = () => (document.body.classList.contains('capture') ? null : document.getElementById('vo'));
  let wall0 = 0, t0 = 0;
  function loop(now) {
    if (!S.playing) return;
    const v = vo();
    let t = t0 + (now - wall0) / 1000;
    if (v && !v.paused && !v.ended) { t = v.currentTime; t0 = t; wall0 = now; }
    if (t >= S.duration) {
      if (params.get('loop') === '1') { t0 = 0; wall0 = now; t = 0; } else { t = S.duration; S.playing = false; }
    }
    S.seek(t);
    if (S.playing) requestAnimationFrame(loop);
    S.onState && S.onState();
  }
  S.play = () => {
    if (S.t >= S.duration) S.t = 0;
    const v = vo();
    if (v && S.t < v.duration - 0.05) { v.currentTime = S.t; v.play().catch(() => {}); }
    S.playing = true; t0 = S.t; wall0 = performance.now();
    requestAnimationFrame(loop); S.onState && S.onState();
  };
  S.pause = () => { S.playing = false; const v = vo(); if (v) v.pause(); S.onState && S.onState(); };
  S.scrub = (t) => { S.seek(t); const v = vo(); if (v) v.currentTime = Math.min(t, (v.duration || t) - 0.04); };
  S.toggle = () => (S.playing ? S.pause() : S.play());

  /* ------------------------------------------------------------------
     缩放 / 测量
     ------------------------------------------------------------------ */
  let scale = 1;
  function fit() {
    const st = $('#stage');
    if (params.get('capture') === '1') { scale = 1; st.style.transform = 'none'; return; }
    scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    st.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
    st.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
    st.style.transform = `scale(${scale})`;
  }
  function rectOf(el) {
    const s = $('#stage').getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: (r.left - s.left) / scale, y: (r.top - s.top) / scale, w: r.width / scale, h: r.height / scale };
  }
  S.rect = rectOf;

  /* ------------------------------------------------------------------
     启动
     ------------------------------------------------------------------ */
  S.boot = async () => {
    const b = document.body.classList;
    if (params.get('capture') === '1') b.add('capture');
    if (params.get('guides') === '1') b.add('show-guides');
    if (params.get('subs') === '0') b.add('no-subs');
    if (params.get('slot') === 'key') b.add('slot-key');
    if (params.get('slot') === 'alpha') b.add('slot-alpha');
    fit(); addEventListener('resize', fit);

    const C = S.components;
    C.chrome();
    buildDom();
    C.splitType(document);
    if (document.fonts) { try { await document.fonts.ready; } catch (e) {} }

    $('#bg-light').style.opacity = S.scenes[0].stage === 'dark' ? 0 : 1;
    readBoxes();
    const sr = rectOf($('#slot .slot'));
    S.slotRect = sr;
    buildTimeline();
    lint({ x: 0, y: sr.y - 40, r: sr.x + sr.w + 40, b: 1080 });

    S.ready = true;
    const tq = params.get('t');
    if (tq !== null) { S.seek(parseFloat(tq) || 0); b.add('capture'); }
    else {
      S.seek(0);
      // 有声播放必须由用户点击触发（浏览器限制），所以不自动播放；?autoplay=muted 可静音自动播放
      if (params.get('autoplay') === 'muted') { const v = vo(); if (v) v.muted = true; setTimeout(S.play, 300); }
    }
    S.player && S.player();
    dispatchEvent(new Event('studio:ready'));
  };
})();
</script>
<script>/* js/components.js */
/* ==========================================================================
   ch02 · components.js — 口播框 / 系列标记 / 参考线 / 逐字拆分 / 图标 / 播放器
   场景文件只写 HTML 结构与 cues，不写 JS 逻辑。
   ========================================================================== */
(function () {
  'use strict';
  const S = window.Studio;
  const C = (S.components = {});

  /* ---------- 图标 ---------- */
  const ICONS = {
    folder: (c) => `<svg viewBox="0 0 32 32" class="ico"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h7l3 3h11A2.5 2.5 0 0 1 29 11.5v12A2.5 2.5 0 0 1 26.5 26h-21A2.5 2.5 0 0 1 3 23.5z" fill="${c}" fill-opacity=".2" stroke="${c}" stroke-width="2" stroke-linejoin="round"/></svg>`,
    file: (c) => `<svg viewBox="0 0 32 32" class="ico"><path d="M8 3.5h11l7 7v17a1.5 1.5 0 0 1-1.5 1.5h-16A1.5 1.5 0 0 1 7 27.5V5A1.5 1.5 0 0 1 8 3.5z" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><path d="M19 3.5V10.5h7" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><path d="M11.5 17h9M11.5 21.5h6" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`,
    check: () => `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    cross: () => `<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`,
    camera: (c) => `<svg viewBox="0 0 48 48"><rect x="5" y="13" width="27" height="22" rx="5" fill="none" stroke="${c}" stroke-width="2.5"/><path d="M32 21l11-6v18l-11-6z" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/></svg>`,
  };
  S.icon = (name, color = 'currentColor') => ICONS[name](color);

  /* ---------- 常驻元素：口播框 / 系列标记 / 参考线 ---------- */
  C.chrome = () => {
    const name = S.config.slot.name ?? '阿泽';
    document.getElementById('slot').innerHTML = `
      <div class="slot" data-role="presenter-slot">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div class="info">${S.icon('camera', '#fff')}<div class="t">口播画面</div><div class="m">9:16 · 280 × 498<br>x 96 · y 528</div></div>
        ${S.config.slot.video ? `<video id="vo" class="vo" src="${S.config.slot.video}" playsinline preload="auto"></video>` : ''}
        ${name ? `<div class="name">${name}</div>` : ''}
      </div>`;
    document.getElementById('chrome').innerHTML = S.config.series
      ? `<div class="series adapt"><i></i>${S.config.series}</div>` : '';
    document.getElementById('guides').innerHTML = `
      <div class="g-safe"></div><div class="g-main"></div><div class="g-axis"></div><div class="g-zone"></div>
      <div class="g-label" style="left:1660px;top:58px">SAFE 96 / 54</div>
      <div class="g-label" style="left:422px;top:130px">对称安全列 416 → 1504 · 中轴 960</div>
      <div class="g-label" style="left:100px;top:460px;color:#E5484D">PRESENTER ZONE</div>`;
  };

  /* ---------- 逐字拆分：.c-type 内所有文字节点 → <span class="ch"> ----------
     保留 <em> / .mono / .c-mark 等嵌套；空格不拆；.hl 等装饰元素跳过。 */
  C.splitType = (root) => {
    root.querySelectorAll('.c-type').forEach((el) => {
      const walk = (node) => {
        [...node.childNodes].forEach((n) => {
          if (n.nodeType === 3) {
            const frag = document.createDocumentFragment();
            for (const ch of n.textContent) {
              if (/\s/.test(ch)) { frag.appendChild(document.createTextNode(ch)); continue; }
              const s = document.createElement('span');
              s.className = 'ch'; s.textContent = ch;
              frag.appendChild(s);
            }
            n.replaceWith(frag);
          } else if (n.nodeType === 1 && !n.classList.contains('hl') && n.tagName !== 'svg') walk(n);
        });
      };
      walk(el);
    });
  };

  /* ---------- 播放器（预览用） ---------- */
  S.player = () => {
    const ui = document.getElementById('player');
    if (!ui) return;
    const btn = ui.querySelector('[data-act=play]');
    const bar = ui.querySelector('input');
    const time = ui.querySelector('.time');
    bar.max = S.duration;
    S.onTick = (t) => { bar.value = t; time.textContent = `${t.toFixed(2).padStart(5, '0')} / ${S.duration.toFixed(1)}s`; };
    S.onState = () => { btn.textContent = S.playing ? '❚❚ 暂停' : (S.t >= S.duration ? '↺ 重播' : '▶ 播放'); };
    S.onTick(S.t); S.onState();
    btn.onclick = () => S.toggle();
    bar.oninput = () => { S.pause(); (S.scrub || S.seek)(+bar.value); };
    const cls = document.body.classList;
    const cycleSlot = () => {
      const modes = ['', 'slot-key', 'slot-alpha'];
      const cur = Math.max(0, modes.findIndex((m) => m && cls.contains(m)));
      modes.forEach((m) => m && cls.remove(m));
      const next = modes[(cur + 1) % modes.length];
      if (next) cls.add(next);
    };
    ui.querySelector('[data-act=guides]').onclick = () => cls.toggle('show-guides');
    ui.querySelector('[data-act=subs]').onclick = () => cls.toggle('no-subs');
    ui.querySelector('[data-act=slot]').onclick = cycleSlot;
    addEventListener('keydown', (e) => {
      const f = 1 / S.FPS;
      if (e.code === 'Space') { e.preventDefault(); S.toggle(); }
      else if (e.code === 'ArrowRight') { S.pause(); (S.scrub || S.seek)(S.t + (e.shiftKey ? f : 2)); }
      else if (e.code === 'ArrowLeft') { S.pause(); (S.scrub || S.seek)(S.t - (e.shiftKey ? f : 2)); }
      else if (e.code === 'Home') { S.pause(); (S.scrub || S.seek)(0); }
      else if (e.code === 'KeyG') cls.toggle('show-guides');
      else if (e.code === 'KeyS') cls.toggle('no-subs');
      else if (e.code === 'KeyK') cycleSlot();
    });
    let idle;
    addEventListener('mousemove', () => {
      cls.remove('idle'); clearTimeout(idle);
      idle = setTimeout(() => S.playing && cls.add('idle'), 1800);
    });
  };
})();
</script>

<script>/* js/parts/pA-worth.js */

         →「两种情况没必要」：四个例子退后，下方两张虚线卡：一次性任务（×）/ 流程和验收标准没想清楚（×）

         →「只能保存和复用方法」→「模糊口号变不成好方法」

    html: `
      <div class="hero-wrap ttl"><div class="c-morph">
        <div data-state="a" class="c-hero c-type">什么任务<em>值得做</em>？</div>
        <div data-state="b" class="c-hero c-type">就看<em>两条标准</em></div>
        <div data-state="c" class="c-hero c-type">已有<em>稳定方法</em></div>
        <div data-state="d" class="c-hero c-type">做成 Skill <em>最划算</em></div>
        <div data-state="e" class="c-hero c-type">两种情况<em class="red">没必要</em></div>
        <div data-state="f" class="c-hero c-type">只能<em>保存和复用</em>方法</div>
        <div data-state="g" class="c-hero c-type">口号<em class="red">变不成</em>好方法</div>
      </div></div>
      <div class="l-at row-c crit"><div class="c-chip k1"><span class="n">①</span>高频重复</div><div class="c-chip k2"><span class="n">②</span>流程和标准明确</div></div>
