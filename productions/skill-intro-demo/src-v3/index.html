<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill 入门 · 视觉样片 v3</title>
<!-- 开发入口：tools/build.py --src src-v3 --out demo-v3/index.html 会把样式 / 脚本 / 字体内联成单文件 -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/scenes.css">
</head>
<body>
<div id="stage">
  <div class="layer" id="bg-dark"></div>
  <div class="layer" id="bg-light"></div>
  <div class="layer" id="scenes"></div>
  <div class="layer" id="chapters"></div>
  <div class="layer" id="chrome"></div>
  <div class="layer" id="subs"></div>
  <div class="layer" id="slot"></div>
  <div class="layer" id="guides"></div>
</div>

<div id="player">
  <button data-act="play">▶ 播放</button>
  <input type="range" min="0" max="1" step="0.001" value="0">
  <span class="time">00.00</span>
  <button class="ghost" data-act="guides" title="G">参考线</button>
  <button class="ghost" data-act="subs" title="S">字幕</button>
  <button class="ghost" data-act="slot" title="K">口播框</button>
</div>
<div id="lint"></div>

<script src="js/engine.js"></script>
<script src="js/components.js"></script>
<!-- 一个文件 = 一个「部分」；部分内部靠变化推进，部分之间才换卡 -->
<script src="js/scenes/pA-repeat.js"></script>
<script src="js/scenes/pB-sop.js"></script>
<script src="js/scenes/pC-anatomy.js"></script>
<script>Studio.boot();</script>
</body>
</html>
