<style>/* styles/tokens.css */
/* ==========================================================================
   tokens.css — 视觉规范（Design Tokens）
   全片唯一的「真值来源」。改颜色 / 字号 / 动效 / 口播框，只改这里。
   画布按 1920×1080 设计，所有数值均为画布像素（px），由 engine 统一缩放。
   ========================================================================== */
:root {
  /* ---------- 画布与安全区 ---------- */
  --canvas-w: 1920px;
  --canvas-h: 1080px;
  --safe-x: 96px;            /* 5% Title Safe（横向） */
  --safe-y: 54px;            /* 5% Title Safe（纵向） */

  /* ---------- 口播预留框（竖屏 9:16 小窗） ----------
     x=96, y=528, w=280, h=498 → 右下角 (376, 1026)，正好贴住左下安全线。 */
  --slot-w: 280px;
  --slot-h: 498px;
  --slot-x: var(--safe-x);
  --slot-y: calc(var(--canvas-h) - var(--safe-y) - var(--slot-h)); /* 528 */
  --slot-gutter: 40px;       /* 口播框与主视觉之间的最小留白 */

  /* ---------- 主视觉区（避开口播框后的内容列） ----------
     x: 456 → 1824（宽 1368），中心 x = 1140。 */
  --main-x: calc(var(--slot-x) + var(--slot-w) + var(--slot-gutter) + 40px); /* 456 */
  --main-r: calc(var(--canvas-w) - var(--safe-x));                           /* 1824 */
  --main-w: calc(var(--main-r) - var(--main-x));                             /* 1368 */

  /* ---------- 颜色 ---------- */
  --c-bg: #070709;           /* 深邃黑背景 */
  --c-card: #14151A;         /* 卡片底色 */
  --c-card-hi: #1B1D24;      /* 卡片内高亮行 */
  --c-line: rgba(255, 255, 255, 0.15);  /* 卡片描边 */
  --c-line-soft: rgba(255, 255, 255, 0.08);
  --c-text: #F4F5F7;         /* 主文字（不用纯白，降低刺眼） */
  --c-text-2: rgba(244, 245, 247, 0.62);
  --c-text-3: rgba(244, 245, 247, 0.38);
  --c-green: #B8FF01;        /* 荧光绿：主强调 / 胶囊底 / 提炼大字 */
  --c-on-green: #000000;     /* 荧光绿上的文字 */
  --c-yellow: #FFD600;       /* 明黄：重点文字 / 虚线框 */
  --c-blue: #38BDF8;         /* 科技蓝：文件夹 / 结构 */
  --c-red: #FF4D4F;          /* 警告 / 错误 */

  /* ---------- 字体 ---------- */
  --font-sans: "SkillSans", "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC",
               "Microsoft YaHei", sans-serif;
  --font-mono: "SkillMono", "JetBrains Mono", "Fira Code", "SkillSans",
               "Noto Sans Mono CJK SC", monospace;

  /* 字号层级（画布 px）：大字报 > 标题 > 卡片 > 字幕 > 注释 */
  --fs-hero: 168px;          /* 提炼大字（≤10 字） */
  --fs-title: 120px;         /* 次级大字 */
  --fs-h2: 56px;
  --fs-card: 30px;           /* 卡片内文字 */
  --fs-sub: 38px;            /* 字幕 */
  --fs-pill: 30px;           /* 胶囊 */
  --fs-note: 22px;           /* 注释 / 标签 / 角标 */

  --fw-hero: 900;
  --fw-bold: 800;
  --fw-semi: 600;
  --fw-text: 500;

  --hero-skew: -6deg;        /* 主视觉大字微斜体 */
  --tracking-hero: -0.02em;
  --tracking-text: 0.02em;

  /* ---------- 形状 ---------- */
  --radius: 16px;
  --radius-pill: 999px;
  --border: 1px solid var(--c-line);
  --dash-w: 2px;             /* 虚线框线宽 */
  --dash-pattern: 10 8;      /* 虚线：实 10 / 空 8（SVG 用） */

  /* ---------- 动效 ---------- */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 250ms;
  --dur-base: 300ms;
  --dur-slow: 350ms;
  --dur-draw: 400ms;

  /* 文档压暗（铁律） */
  --dim-opacity: 0.25;
  --dim-blur: 2px;
}
</style>
<style>/* styles/base.css */
/* ==========================================================================
   base.css — 舞台、图层、背景、字幕、口播框、章节角标、调试参考线、播放器 UI
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

/* ---------- 舞台：固定 1920×1080，由 JS 等比缩放居中 ---------- */
#stage {
  position: absolute;
  left: 50%; top: 50%;
  width: var(--canvas-w); height: var(--canvas-h);
  transform-origin: 0 0;
  background: var(--c-bg);
  overflow: hidden;
  font-family: var(--font-sans);
  color: var(--c-text);
  font-feature-settings: "palt" 1;     /* CJK 标点挤压，排版更紧凑 */
  letter-spacing: var(--tracking-text);
}

.layer { position: absolute; inset: 0; pointer-events: none; }

/* ---------- 背景：极暗暗角 + 星尘 ---------- */
.bg-vignette {
  background:
    radial-gradient(1200px 800px at 62% 44%, rgba(255,255,255,0.025), transparent 70%),
    radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
}
.dust {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  will-change: transform, opacity;
}

/* ---------- 场景容器 ---------- */
.scene { position: absolute; inset: 0; }
.scene .lift-layer { position: absolute; inset: 0; pointer-events: none; }

/* ---------- 字幕：主视觉区底部居中，单行 ---------- */
.subtitle-layer .sub {
  position: absolute;
  left: var(--main-x);
  width: var(--main-w);
  bottom: calc(var(--safe-y) + 6px);
  text-align: center;
  font-size: var(--fs-sub);
  font-weight: var(--fw-semi);
  line-height: 1.3;
  letter-spacing: 0.04em;
  color: rgba(244,245,247,0.92);
  text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.9);
  white-space: nowrap;
  font-feature-settings: normal;   /* 字幕不挤压标点，保证逗号/问号可读 */
}
.subtitle-layer .sub .en { font-family: var(--font-mono); font-weight: 600; letter-spacing: 0; }
.no-subs .subtitle-layer { display: none; }

/* ---------- 章节角标（左上） ---------- */
.chapter {
  position: absolute;
  left: var(--safe-x); top: var(--safe-y);
  display: flex; align-items: center; gap: 16px;
  font-size: var(--fs-note);
  font-weight: var(--fw-semi);
  color: var(--c-text-2);
  letter-spacing: 0.06em;
}
.chapter .no {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--c-green);
  letter-spacing: 0;
}
.chapter .bar { width: 28px; height: 2px; background: var(--c-line); }

/* ---------- 口播预留框（左下，竖屏 9:16） ---------- */
.slot {
  position: absolute;
  left: var(--slot-x); top: var(--slot-y);
  width: var(--slot-w); height: var(--slot-h);
  border-radius: var(--radius);
  border: var(--border);
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.022) 0 2px, transparent 2px 14px),
    #0C0D11;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  overflow: hidden;
}
.slot .corner { position: absolute; width: 22px; height: 22px; border-color: rgba(255,255,255,0.45); border-style: solid; border-width: 0; }
.slot .corner.tl { left: 14px; top: 14px;    border-left-width: 2px; border-top-width: 2px; }
.slot .corner.tr { right: 14px; top: 14px;   border-right-width: 2px; border-top-width: 2px; }
.slot .corner.bl { left: 14px; bottom: 14px; border-left-width: 2px; border-bottom-width: 2px; }
.slot .corner.br { right: 14px; bottom: 14px; border-right-width: 2px; border-bottom-width: 2px; }
.slot .slot-info {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  text-align: center;
}
.slot .slot-icon { width: 56px; height: 56px; opacity: 0.4; }
.slot .slot-title { font-size: 26px; font-weight: var(--fw-bold); color: var(--c-text-2); letter-spacing: 0.12em; }
.slot .slot-meta { font-family: var(--font-mono); font-size: 17px; color: var(--c-text-3); letter-spacing: 0.02em; line-height: 1.6; }
.slot .slot-rec {
  position: absolute; top: 18px; left: 50%; translate: -50% 0;
  font-family: var(--font-mono); font-size: 14px; color: var(--c-text-3); letter-spacing: 0.12em;
  display: flex; align-items: center; gap: 8px;
}
.slot .slot-rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-green); box-shadow: 0 0 10px var(--c-green); }
.slot .slot-name {
  position: absolute; left: 30px; bottom: 46px;
  padding: 6px 16px; border-radius: var(--radius-pill);
  background: var(--c-green); color: var(--c-on-green);

<script>/* js/engine.js */
/* ==========================================================================
   engine.js — 确定性时间轴引擎（无依赖）
   --------------------------------------------------------------------------
   · 所有动画都用 Web Animations API 创建后立即暂停，由一个主时钟统一设置
     currentTime。任意时刻 seek(t) 得到的画面完全一致 → 可逐帧导出成片。
   · 场景 = { id, chapter, duration, html, cues[], subs[] }，见 js/scenes/*.js
   · cue  = { at: 秒(相对场景), sel: CSS 选择器, fx: 动效名, stagger?: 秒 }
   · 动效预设（fx）只在这里定义一次，场景里只写名字 → 全片节奏统一。
   URL 参数：
     ?t=3.2        跳到 3.2s 并暂停（截图 / 审片）
     ?capture=1    1:1 输出 1920×1080，隐藏播放器（导出用）
     ?guides=1     显示安全区 / 主视觉区 / 口播禁区参考线
     ?subs=0       隐藏字幕
     ?slot=key     口播框填纯绿 #00FF00（色键）  ?slot=alpha 透明
     ?loop=1       循环播放        ?autoplay=0  不自动播放
   快捷键：空格 播放/暂停 · ←/→ ±0.5s（Shift ±1 帧）· Home 回到开头
           G 参考线 · S 字幕 · K 口播框模式
   ========================================================================== */
(function () {
  'use strict';

  const S = (window.Studio = window.Studio || {});
  S.scenes = [];
  S.scene = (def) => S.scenes.push(def);
  S.FPS = 30;
  S.EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
  S.DEMO_RANGE = [12, 20];          // 本演示的时长约束（lint 用）

  /* ------------------------------------------------------------------
     动效预设 —— 返回 [target, keyframes, duration(ms), options?][]
     规范：入场/强调 250–350ms，统一 S.EASE；不做慢吞吞的淡入淡出。
     只动 opacity / scale / translate / filter / clip-path，
     不碰 transform（组件的 skew 等静态造型放在 transform 上，互不覆盖）。
     ------------------------------------------------------------------ */
  const fx = (S.fx = {
    // 卡片 / 胶囊 / 芯片：弹性缩放入场
    pop: (el) => [[el, [{ opacity: 0, scale: '0.86' }, { opacity: 1, scale: '1' }], 300]],
    // 提炼大字：从大到小「砸」进画面
    slam: (el) => [[el, [{ opacity: 0, scale: '1.42' }, { opacity: 1, scale: '1' }], 320]],
    // 列表行：短距离上推
    rise: (el) => [[el, [{ opacity: 0, translate: '0 26px' }, { opacity: 1, translate: '0 0' }], 280]],
    // 文字擦出（左→右）
    wipe: (el) => [[el, [{ clipPath: 'inset(-30% 100% -30% -4%)' }, { clipPath: 'inset(-30% -4% -30% -4%)' }], 300]],
    // 铁律：文档压暗
    dim: (el) => [[el, [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0.25, filter: 'blur(2px)' }], 250]],
    // 退到次要层级（不模糊）
    recede: (el) => [[el, [{ opacity: 1 }, { opacity: 0.4 }], 250]],
    // 出场
    out: (el) => [[el, [{ opacity: 1, scale: '1' }, { opacity: 0, scale: '0.92' }], 250]],
    // 错误抖动
    shake: (el) => [[el, [
      { translate: '0 0' }, { translate: '-10px 0' }, { translate: '9px 0' },
      { translate: '-6px 0' }, { translate: '3px 0' }, { translate: '0 0' }], 320, { easing: 'linear' }]],
    // 横向生长（删除线 / 进度条）
    grow: (el) => [[el, [{ scale: '0 1' }, { scale: '1 1' }], 300]],
    // 虚线框绘制（SVG stroke-dashoffset）+ 绘制完成后行军蚁微动
    draw: (el) => {
      const mask = el.querySelector(':scope > svg.dash .dash-mask');
      const line = el.querySelector(':scope > svg.dash .dash-line');
      if (!mask) throw new Error('draw: 目标缺少 .c-frame 虚线框');
      return [
        [mask, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], 400],
        [line, [{ strokeDashoffset: 0 }, { strokeDashoffset: -36 }], 1400,
          { easing: 'linear', iterations: Infinity, delay: 400, fill: 'none' }],
      ];
    },
    // 内部：场景 / 字幕显隐
    show: (el) => [[el, [{ opacity: 0 }, { opacity: 1 }], 1, { easing: 'linear' }]],
    subIn: (el) => [[el, [{ opacity: 0, translate: '0 10px' }, { opacity: 1, translate: '0 0' }], 220]],
    subOut: (el) => [[el, [{ opacity: 1 }, { opacity: 0 }], 120, { easing: 'linear' }]],
  });

  /* ------------------------------------------------------------------ */
  const $ = (s, r = document) => r.querySelector(s);
  const params = new URLSearchParams(location.search);
  const anims = [];
  const cueLog = [];                // [{abs, el, fx}] —— lint 用
  const touched = new WeakSet();    // 每个目标的第一条动画用 fill:both
  S.lint = [];
  S.t = 0;
  S.playing = false;

  function addAnim(target, keyframes, durMs, absSec, o = {}) {
    const fill = o.fill || (touched.has(target) ? 'forwards' : 'both');
    touched.add(target);
    const a = target.animate(keyframes, {
      duration: durMs,
      delay: absSec * 1000 + (o.delay || 0),
      fill,
      easing: o.easing || S.EASE,
      iterations: o.iterations || 1,
      direction: o.direction || 'normal',
    });
    a.pause();
    anims.push(a);
    return a;
  }
  S.ambient = (target, keyframes, o) => {   // 背景循环动画（星尘等）
    const a = target.animate(keyframes, Object.assign({ fill: 'both', iterations: Infinity }, o));
    a.pause();
    anims.push(a);
  };

  function runFx(name, el, absSec) {
    const preset = fx[name];
    if (!preset) { S.lint.push(`未知动效 fx="${name}"`); return; }
    preset(el).forEach(([target, kf, dur, o]) => addAnim(target, kf, dur, absSec, o));
    cueLog.push({ abs: absSec, el, fx: name });
  }

  /* ------------------------------------------------------------------
     构建：场景 DOM → 组件注入 → 时间轴
     ------------------------------------------------------------------ */
  function buildDom() {
    const host = $('#scenes');
    let t = 0;
    S.scenes.forEach((def) => {
      const sec = document.createElement('section');
      sec.className = 'scene';
      sec.id = def.id;
      sec.innerHTML = def.html + '<div class="lift-layer"></div>';
      host.appendChild(sec);
      def.el = sec;
      def.start = t;
      def.end = t + def.duration;
      t += def.duration;
    });
    S.duration = t;
  }

  function buildTimeline() {
    const cues = [];
    const last = S.scenes[S.scenes.length - 1];

    S.scenes.forEach((def) => {
      cues.push({ abs: def.start, el: def.el, fx: 'show' });
      if (def !== last) cues.push({ abs: def.end - 0.25, el: def.el, fx: 'out' });

      (def.cues || []).forEach((c) => {
        const els = def.el.querySelectorAll(c.sel);
        if (!els.length) S.lint.push(`[${def.id}] 选择器没有命中：${c.sel}`);
        els.forEach((el, k) => cues.push({ abs: def.start + c.at + (c.stagger || 0) * k, el, fx: c.fx }));
      });

      // 字幕
      (def.subs || []).forEach((s) => {
        const d = document.createElement('div');
        d.className = 'sub';
        d.textContent = s.text;
        $('#subs').appendChild(d);
        cues.push({ abs: def.start + s.from, el: d, fx: 'subIn', sub: s, scene: def });
        cues.push({ abs: def.start + s.to, el: d, fx: 'subOut' });
      });
    });

    // 章节角标：相邻同章节合并为一组，组内只入场一次
    const groups = [];
    S.scenes.forEach((def) => {
      const key = def.chapter ? def.chapter.no + '|' + def.chapter.title : '';
      const g = groups[groups.length - 1];
      if (g && g.key === key) g.end = def.end;
      else groups.push({ key, chapter: def.chapter, start: def.start, end: def.end });
    });
    groups.forEach((g, i) => {
      if (!g.chapter) return;
      const d = document.createElement('div');
      d.className = 'chapter';
      d.innerHTML = `<span class="no">${g.chapter.no}</span><span class="bar"></span><span>${g.chapter.title}</span>`;
      $('#chapters').appendChild(d);
      cues.push({ abs: g.start + 0.05, el: d, fx: 'rise' });
      if (i < groups.length - 1) cues.push({ abs: g.end - 0.25, el: d, fx: 'out' });
    });

    cues.sort((a, b) => a.abs - b.abs)
      .forEach((c) => runFx(c.fx, c.el, c.abs));
    S._cues = cues;
  }

  const LINT_BOXES = '.scene .c-card, .scene .c-hero, .scene .c-pill, .scene .c-chip, .scene .c-lifted, .scene .c-tag';

  /* ------------------------------------------------------------------
     铁律 & 版式自动校验（结果显示在右上角，并暴露在 Studio.lint）
     ------------------------------------------------------------------ */
  function lint(measure) {
    const [lo, hi] = S.DEMO_RANGE;
    if (S.duration < lo || S.duration > hi) S.lint.push(`总时长 ${S.duration.toFixed(2)}s 不在 ${lo}–${hi}s`);

    // 1) 文档出现后 ≤1s 必须压暗；可读窗口内不得有字幕
    const subs = S._cues.filter((c) => c.fx === 'subIn');
    document.querySelectorAll('.scene .c-doc:not(.c-lifted)').forEach((doc) => {
      // 入场时间 = 文档自身或其任一子元素最早的入场 cue（卡片组也适用）
      const tin = cueLog.find((c) => (c.el === doc || doc.contains(c.el)) && ['pop', 'rise', 'wipe', 'slam'].includes(c.fx));
      const tdim = cueLog.find((c) => c.el === doc && c.fx === 'dim');
      const sceneStart = S.scenes.find((d) => d.el.contains(doc)).start;
      const tIn = tin ? tin.abs : sceneStart;
      if (!tdim) { S.lint.push(`文档 ${doc.dataset.name || ''} 没有 dim（铁律）`); return; }
      if (tdim.abs - tIn > 1.05) S.lint.push(`文档 ${doc.dataset.name || ''} 出现 ${(tdim.abs - tIn).toFixed(2)}s 后才压暗（应 ≤1s）`);
      subs.forEach((s) => {
        const sEnd = s.scene.start + s.sub.to;
        if (s.abs < tdim.abs && sEnd > tIn) S.lint.push(`字幕「${s.sub.text}」与可读文档同时出现`);
      });
    });

    // 2) 提炼大字 ≤10 字
    document.querySelectorAll('.scene .c-hero').forEach((h) => {
      const n = h.textContent.replace(/\s/g, '').length;
      if (n > 10) S.lint.push(`大字「${h.textContent.trim()}」${n} 字，超过 10 字`);
    });

    // 3) 主视觉元素不得进入口播禁区（口播框外扩 gutter）
    const zone = measure.zone;
    measure.rects.forEach(({ el, r }) => {
      const hit = r.x < zone.r && r.x + r.w > zone.x && r.y < zone.b && r.y + r.h > zone.y;
      if (hit) S.lint.push(`元素进入口播禁区：${el.className} @ (${r.x | 0},${r.y | 0},${r.w | 0}×${r.h | 0})`);
      const safe = r.x >= 96 - 1 && r.y >= 54 - 1 && r.x + r.w <= 1824 + 1 && r.y + r.h <= 1026 + 1;
      if (!safe) S.lint.push(`元素越出安全区：${el.className} @ (${r.x | 0},${r.y | 0},${r.w | 0}×${r.h | 0})`);
    });

    const box = $('#lint');
    if (box && S.lint.length) {
      box.style.display = 'block';
      box.innerHTML = '<b>LINT</b><br>' + S.lint.map((s) => '· ' + s).join('<br>');
    }
    S.lint.forEach((m) => console.warn('[lint]', m));
  }

  /* ------------------------------------------------------------------
     时钟 / 播放
     ------------------------------------------------------------------ */
  S.seek = (t) => {
    S.t = Math.max(0, Math.min(S.duration, t));
    const ms = S.t * 1000;
    for (let i = 0; i < anims.length; i++) anims[i].currentTime = ms;
    S.onTick && S.onTick(S.t);
  };
  // 导出用：seek 后等两帧，保证画面已合成
  S.frame = (t) => new Promise((res) => { S.seek(t); requestAnimationFrame(() => requestAnimationFrame(res)); });

  let wall0 = 0, t0 = 0;
  function loop(now) {
    if (!S.playing) return;
    let t = t0 + (now - wall0) / 1000;
    if (t >= S.duration) {
      if (params.get('loop') === '1') { t0 = 0; wall0 = now; t = 0; }
      else { t = S.duration; S.playing = false; }
    }
    S.seek(t);
    if (S.playing) requestAnimationFrame(loop);
    S.onState && S.onState();
  }
  S.play = () => {
    if (S.t >= S.duration) S.t = 0;
    S.playing = true; t0 = S.t; wall0 = performance.now();
    requestAnimationFrame(loop);
    S.onState && S.onState();
  };
  S.pause = () => { S.playing = false; S.onState && S.onState(); };
  S.toggle = () => (S.playing ? S.pause() : S.play());

  /* ------------------------------------------------------------------
     舞台缩放
     ------------------------------------------------------------------ */
  let scale = 1;
  function fit() {
    const st = $('#stage');
    if (params.get('capture') === '1') { scale = 1; st.style.left = '0px'; st.style.top = '0px'; st.style.transform = 'none'; return; }
    scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    st.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
    st.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
    st.style.transform = `scale(${scale})`;
  }
  // 以画布坐标测量元素（不受缩放影响）
  function rectOf(el) {
    const s = $('#stage').getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return { x: (r.left - s.left) / scale, y: (r.top - s.top) / scale, w: r.width / scale, h: r.height / scale };
  }
  S.rect = rectOf;

  /* ------------------------------------------------------------------
     启动
     ------------------------------------------------------------------ */
  S.boot = async () => {
    const body = document.body;
    if (params.get('capture') === '1') body.classList.add('capture');
    if (params.get('guides') === '1') body.classList.add('show-guides');
    if (params.get('subs') === '0') body.classList.add('no-subs');
    if (params.get('slot') === 'key') body.classList.add('slot-key');
    if (params.get('slot') === 'alpha') body.classList.add('slot-alpha');

    fit();
    addEventListener('resize', fit);
    buildDom();
    if (document.fonts) { try { await document.fonts.ready; } catch (e) {} }

    // 组件注入（必须在动画创建之前测量，此时没有任何 transform）
    const C = S.components;
    C.presenterSlot($('#slot'), S.config.slot);
    C.guides($('#guides'));
    S.scenes.forEach((def) => C.lifts(def.el, rectOf));
    C.frames(document);
    C.starfield($('#dust'), S.config.dust);

    // 版式测量必须在创建动画之前（此时没有入场 scale / translate）
    const rects = [...document.querySelectorAll(LINT_BOXES)].map((el) => ({ el, r: rectOf(el) }));
    buildTimeline();
    // 口播禁区 = 口播框向上/向右外扩 gutter，并延伸到画布左缘与底边
    const sr = rectOf($('#slot .slot'));
    const gutter = 40;
    const zone = { x: 0, y: sr.y - gutter, r: sr.x + sr.w + gutter, b: 1080 };
    S.slotRect = sr;
    lint({ zone, rects });

    S.ready = true;
    const tq = params.get('t');
    if (tq !== null) { S.seek(parseFloat(tq) || 0); body.classList.add('capture'); }
    else {
      S.seek(0);
      if (params.get('capture') !== '1' && params.get('autoplay') !== '0') setTimeout(S.play, 400);
    }
    S.player && S.player();
    window.dispatchEvent(new Event('studio:ready'));
  };

  S.config = { slot: {}, dust: {} };
})();
</script>
<script>/* js/components.js */
/* ==========================================================================
   components.js — 可复用组件：口播框、参考线、虚线框、提起行、星尘、图标、播放器
   全部是纯函数式 DOM 注入，场景文件只写 HTML 结构 + class，不写 JS 逻辑。
   ========================================================================== */
(function () {
  'use strict';
  const S = window.Studio;
  const C = (S.components = {});

  /* ---------- 图标（内联 SVG，无外部资源） ---------- */
  const ICONS = {
    folder: (c) => `<svg viewBox="0 0 32 32" class="ico"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h7l3 3h11A2.5 2.5 0 0 1 29 11.5v12A2.5 2.5 0 0 1 26.5 26h-21A2.5 2.5 0 0 1 3 23.5z" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="2" stroke-linejoin="round"/></svg>`,
    file: (c) => `<svg viewBox="0 0 32 32" class="ico"><path d="M8 3.5h11l7 7v17a1.5 1.5 0 0 1-1.5 1.5h-16A1.5 1.5 0 0 1 7 27.5V5A1.5 1.5 0 0 1 8 3.5z" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><path d="M19 3.5V10.5h7" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><path d="M11.5 17h9M11.5 21.5h6" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`,
    camera: (c) => `<svg viewBox="0 0 48 48" class="slot-icon"><rect x="5" y="13" width="27" height="22" rx="4" fill="none" stroke="${c}" stroke-width="2.5"/><path d="M32 21l11-6v18l-11-6z" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/></svg>`,
  };
  S.icon = (name, color = 'currentColor') => ICONS[name](color);

  /* ---------- 口播预留框 ---------- */
  C.presenterSlot = (host, o = {}) => {
    const name = o.name ?? '阿泽';
    host.innerHTML = `
      <div class="slot" data-role="presenter-slot">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div class="slot-rec"><i></i>PRESENTER</div>
        <div class="slot-info">
          ${S.icon('camera', '#F4F5F7')}
          <div class="slot-title">口播画面</div>
          <div class="slot-meta">9:16 · 280 × 498<br>x 96 · y 528</div>
        </div>
        ${name ? `<div class="slot-name">${name}</div>` : ''}
      </div>`;
  };

  /* ---------- 参考线 ---------- */
  C.guides = (host) => {
    host.innerHTML = `
      <div class="g-safe"></div><div class="g-main"></div><div class="g-slot-zone"></div>
      <div class="g-label" style="left:1680px;top:58px">SAFE 96 / 54</div>
      <div class="g-label" style="left:460px;top:90px">MAIN 456 → 1824 · center x 1140</div>
      <div class="g-label" style="left:100px;top:452px;color:#FF4D4F">PRESENTER ZONE (no main visuals)</div>`;
  };

  /* ---------- 虚线框：给每个 .c-frame 注入 SVG ----------
     data-pad 外扩像素（默认 14）；data-r 圆角（默认 12）。
     画法：可见层是 2px 黄色虚线；用 pathLength=1 的实线做 mask，
     动画 mask 的 stroke-dashoffset 1→0 实现「沿路径画出虚线框」。 */
  let maskId = 0;
  C.frames = (root) => {
    root.querySelectorAll('.c-frame').forEach((el) => {
      if (el.querySelector(':scope > svg.dash')) return;
      const pad = +(el.dataset.pad ?? 14);
      const r = +(el.dataset.r ?? 12);
      const w = el.offsetWidth + pad * 2;
      const h = el.offsetHeight + pad * 2;
      const id = 'dm' + ++maskId;
      el.insertAdjacentHTML('beforeend', `
        <svg class="dash" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="left:${-pad}px;top:${-pad}px">
          <defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-10" y="-10" width="${w + 20}" height="${h + 20}">
            <rect class="dash-mask" x="1" y="1" width="${w - 2}" height="${h - 2}" rx="${r}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="0"/>
          </mask></defs>
          <rect class="dash-line" x="1" y="1" width="${w - 2}" height="${h - 2}" rx="${r}" mask="url(#${id})"/>
        </svg>`);
    });
  };

  /* ---------- 提起行（铁律配套） ----------
     文档里 data-lift="name" 的行，会被复制到场景的 lift-layer，
     位置与原行完全重合；文档整体 dim 之后，这些副本保持高亮浮在上方。
     副本可用选择器 [data-lifted="name"] 写 cue。 */
  C.lifts = (scene, rectOf) => {
    const layer = scene.querySelector(':scope > .lift-layer');
    const sr = rectOf(scene);
    scene.querySelectorAll('[data-lift]').forEach((ln) => {
      const r = rectOf(ln);
      const wrap = document.createElement('div');
      wrap.className = 'c-doc c-lifted c-frame';
      wrap.dataset.lifted = ln.dataset.lift;
      wrap.dataset.pad = ln.dataset.framePad ?? 10;
      const clone = ln.cloneNode(true);
      clone.removeAttribute('data-lift');
      wrap.appendChild(clone);
      wrap.style.left = r.x - sr.x - 14 + 'px';
      wrap.style.top = r.y - sr.y + 'px';
      layer.appendChild(wrap);
    });
  };

  /* ---------- 星尘：极微弱、慢速漂浮（确定性随机） ---------- */
  C.starfield = (host, o = {}) => {
    const n = o.count ?? 64;
    let seed = o.seed ?? 20251118;
    const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let i = 0; i < n; i++) {
      const d = document.createElement('i');
      d.className = 'dust';
      const size = 1 + rnd() * 1.8;
      const base = 0.06 + rnd() * 0.26;
      d.style.cssText = `left:${rnd() * 1920}px;top:${rnd() * 1080}px;width:${size}px;height:${size}px;opacity:${base}`;
      host.appendChild(d);
      const dx = (rnd() - 0.5) * 70, dy = -10 - rnd() * 50;
      const dur = 9000 + rnd() * 9000;
      S.ambient(d, [
        { translate: '0 0', opacity: base },
        { translate: `${dx}px ${dy}px`, opacity: base * (0.3 + rnd() * 0.5) },
      ], { duration: dur, direction: 'alternate', easing: 'ease-in-out', delay: -rnd() * dur });
    }
  };

  /* ---------- 播放器（仅预览用，不进成片） ---------- */
  S.player = () => {
    const ui = document.getElementById('player');
    if (!ui) return;
    const btn = ui.querySelector('[data-act=play]');
    const bar = ui.querySelector('input');
    const time = ui.querySelector('.time');
    bar.max = S.duration;
    const fmt = (t) => t.toFixed(2).padStart(5, '0');
    S.onTick = (t) => { bar.value = t; time.textContent = `${fmt(t)} / ${S.duration.toFixed(2)}s`; };
    S.onState = () => { btn.textContent = S.playing ? '❚❚ 暂停' : (S.t >= S.duration ? '↺ 重播' : '▶ 播放'); };
    S.onTick(S.t); S.onState();
    btn.onclick = () => S.toggle();
    bar.oninput = () => { S.pause(); S.seek(+bar.value); };
    ui.querySelector('[data-act=guides]').onclick = () => document.body.classList.toggle('show-guides');
    ui.querySelector('[data-act=subs]').onclick = () => document.body.classList.toggle('no-subs');
    const slotModes = ['', 'slot-key', 'slot-alpha'];
    const cycleSlot = () => {
      const b = document.body.classList;
      const cur = slotModes.findIndex((m) => m && b.contains(m));
      slotModes.forEach((m) => m && b.remove(m));
      const next = slotModes[(Math.max(cur, 0) + 1) % slotModes.length];
      if (next) b.add(next);
    };
    ui.querySelector('[data-act=slot]').onclick = cycleSlot;
    addEventListener('keydown', (e) => {
      const f = 1 / S.FPS;
      if (e.code === 'Space') { e.preventDefault(); S.toggle(); }
      else if (e.code === 'ArrowRight') { S.pause(); S.seek(S.t + (e.shiftKey ? f : 0.5)); }
      else if (e.code === 'ArrowLeft') { S.pause(); S.seek(S.t - (e.shiftKey ? f : 0.5)); }
      else if (e.code === 'Home') { S.pause(); S.seek(0); }
      else if (e.code === 'KeyG') document.body.classList.toggle('show-guides');
      else if (e.code === 'KeyS') document.body.classList.toggle('no-subs');
      else if (e.code === 'KeyK') cycleSlot();
    });
    let idle;
    addEventListener('mousemove', () => {
      document.body.classList.remove('idle');
      clearTimeout(idle);
      idle = setTimeout(() => S.playing && document.body.classList.add('idle'), 1800);
    });
  };
})();
</script>

<script>/* js/scenes/s01-hook.js */

</script>
<script>/* js/scenes/s02-sop.js */
/* S02 · 定义 —— Skill = 写给 AI 的 SOP（标准操作手册）
   信息结构：等式 → 提炼大字 → 术语注释 → SOP 五要素 */
(function () {
  const steps = ['何时用', '分几步', '查资料', '报错处理', '交付标准'];
  Studio.scene({
    id: 's02-sop',
    chapter: { no: '01', title: '为什么需要 Skill' },
    duration: 5.2,
    html: `
      <div class="l-col">
        <div class="l-row eq">
          <div class="c-card skill-chip" style="position:relative">${Studio.icon('folder', '#38BDF8')}Skill</div>
          <div class="sign">=</div>
        </div>
        <div class="c-hero"><span class="skew">写给 <span class="en">AI</span> 的 <span class="c-frame en" data-pad="10">SOP</span></span></div>
        <div class="gloss">Standard Operating Procedure · <span class="cn">标准操作手册</span></div>
        <div class="l-row steps">
          ${steps.map((s, i) => `${i ? '<span class="c-arrow">→</span>' : ''}<div class="c-chip"><span class="no">0${i + 1}</span>${s}</div>`).join('')}
        </div>
      </div>`,
    cues: [
      { at: 0.10, sel: '.skill-chip', fx: 'pop' },
      { at: 0.22, sel: '.sign', fx: 'pop' },
      { at: 0.40, sel: '.c-hero', fx: 'slam' },
      { at: 0.85, sel: '.c-hero .c-frame', fx: 'draw' },
      { at: 1.10, sel: '.gloss', fx: 'wipe' },
      { at: 1.70, sel: '.steps > *', fx: 'pop', stagger: 0.07 },
