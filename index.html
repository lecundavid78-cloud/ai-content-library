<!-- 核心逻辑（无 DOM 依赖，Node 测试共用） -->
<script>
/* 全局命名空间。所有模块挂在 KS 下，使用普通 <script> 加载，file:// 直接打开也能运行。 */
/* Chrome 61 尚无 globalThis：先给旧 WebView 提供局部兼容入口。 */
if (typeof globalThis === 'undefined' && typeof window !== 'undefined') window.globalThis = window;
(function (g) {
  'use strict';
  g.KS = g.KS || {};
  var KS = g.KS;
  KS.version = '4.0.0';
  /** 主线三关（只放主线；按 id 1..3 排序，下标 = id-1） */
  KS.LEVELS = KS.LEVELS || [];
  /** 自由选图（独立列表，不并入主线，避免第三关后误进自由地图） */
  KS.FREE_MAPS = KS.FREE_MAPS || [];
  KS.ENDLESS = null;
  /** 主线关卡注册：src/levels/level*.js 调用 */
  KS.registerLevel = function (cfg) {
    cfg.mode = 'tutorial';
    if (!cfg.key) cfg.key = 'main-' + cfg.id;
    KS.LEVELS.push(cfg);
    KS.LEVELS.sort(function (a, b) { return a.id - b.id; });
  };
  /** 自由地图注册：src/levels/free-*.js 调用；order 决定列表顺序 */
  KS.registerFreeMap = function (cfg) {
    cfg.mode = 'free';
    KS.FREE_MAPS.push(cfg);
    KS.FREE_MAPS.sort(function (a, b) { return a.order - b.order; });
  };
  /** 按 key（main-1 / free-u …）查找任意地图；无效 key 返回 null */
  KS.findMap = function (key) {
    var all = KS.LEVELS.concat(KS.FREE_MAPS); if(KS.ENDLESS) all.push(KS.ENDLESS);
    for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
    return null;
  };
  /** 可复现随机数（mulberry32） */
  KS.rng = function (seed) {
    var a = (seed >>> 0) || 1;
    var f = function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.int = function (n) { return Math.floor(f() * n); };
    f.range = function (lo, hi) { return lo + f() * (hi - lo); };
    f.pick = function (arr) { return arr[Math.floor(f() * arr.length)]; };
    f.shuffle = function (arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(f() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    };
    return f;
  };
  KS.clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
  KS.lerp = function (a, b, t) { return a + (b - a) * t; };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * 轨道路径系统（与关卡、坐标、屏幕尺寸无关的通用实现）
 *
 * 关卡里写的是“轨道空间”(TRACK_SPACE: 390×360) 下的控制点，
 * 运行时根据传送带区域的实际矩形做等比映射，然后：
 *   - polyline：折线 + 圆角(圆弧过渡)，适合直线 / U 形 / S 形 / 多段折返
 *   - smooth  ：Catmull-Rom 曲线，适合任意蛇形弯曲
 * 最终统一重采样为“每 1 个逻辑像素一个点”的弧长参数化表，
 * 寿司只需要一个弧长参数 s ∈ [0, length) 就能得到位置与切线方向。
 */
(function (KS) {
  'use strict';

  KS.TRACK_SPACE = { w: 390, h: 360 };

  function Path(xs, ys, length, step) {
    this.xs = xs; this.ys = ys; this.length = length; this.step = step;
    this.n = xs.length;
  }

  /** 返回弧长 s 处的位置与切线（单位向量） */
  Path.prototype.at = function (s, out) {
    out = out || {};
    var step = this.step, n = this.n;
    var f = s / step;
    if (f < 0) f = 0;
    if (f > n - 1.0001) f = n - 1.0001;
    var i = Math.floor(f), t = f - i;
    var x0 = this.xs[i], y0 = this.ys[i], x1 = this.xs[i + 1], y1 = this.ys[i + 1];
    out.x = x0 + (x1 - x0) * t;
    out.y = y0 + (y1 - y0) * t;
    // 切线取前后两点，稍微平滑一点
    var a = Math.max(0, i - 1), b = Math.min(n - 1, i + 2);
    var dx = this.xs[b] - this.xs[a], dy = this.ys[b] - this.ys[a];
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    out.tx = dx / d; out.ty = dy / d;
    return out;
  };

  /** 包围盒 */
  Path.prototype.bounds = function () {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < this.n; i++) {
      var x = this.xs[i], y = this.ys[i];
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  };

  /** 找到路径在矩形内的第一段/最后一段弧长（用于计算可拿取范围、出入口门帘位置） */
  Path.prototype.visibleRange = function (rect, margin) {
    margin = margin || 0;
    var first = -1, last = -1;
    for (var i = 0; i < this.n; i++) {
      var x = this.xs[i], y = this.ys[i];
      var inside = x >= rect.x + margin && x <= rect.x + rect.w - margin &&
                   y >= rect.y + margin && y <= rect.y + rect.h - margin;
      if (inside) { if (first < 0) first = i; last = i; }
    }
    if (first < 0) return null;
    return { start: first * this.step, end: last * this.step };
  };

  // ---------- 构建 ----------

  /** 把一串稠密点按弧长等距重采样 */
  function resample(raw, step) {
    var cum = [0];
    for (var i = 1; i < raw.length; i++) {
      var dx = raw[i][0] - raw[i - 1][0], dy = raw[i][1] - raw[i - 1][1];
      cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
    }
    var total = cum[cum.length - 1];
    var n = Math.max(2, Math.floor(total / step) + 1);
    var xs = new Float32Array(n), ys = new Float32Array(n);
    var j = 0;
    for (var k = 0; k < n; k++) {
      var s = k * step;
      while (j < cum.length - 2 && cum[j + 1] < s) j++;
      var seg = cum[j + 1] - cum[j] || 1;
      var t = KS.clamp((s - cum[j]) / seg, 0, 1);
      xs[k] = raw[j][0] + (raw[j + 1][0] - raw[j][0]) * t;
      ys[k] = raw[j][1] + (raw[j + 1][1] - raw[j][1]) * t;
    }
    return new Path(xs, ys, (n - 1) * step, step);
  }

  /** 折线 + 圆角。radius 可以是数字或与点等长的数组（每个拐点单独半径） */
  function filletPolyline(pts, radius) {
    var out = [pts[0].slice()];
    var n = pts.length;
    // 每条边可用于圆角的长度：两端都有拐点时各占一半
    var segLen = [];
    for (var i = 0; i < n - 1; i++) {
      segLen.push(Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]));
    }
    for (var v = 1; v < n - 1; v++) {
      var P = pts[v], A = pts[v - 1], B = pts[v + 1];
      var l1 = segLen[v - 1], l2 = segLen[v];
      var d1x = (P[0] - A[0]) / l1, d1y = (P[1] - A[1]) / l1;
      var d2x = (B[0] - P[0]) / l2, d2y = (B[1] - P[1]) / l2;
      var dot = KS.clamp(d1x * d2x + d1y * d2y, -1, 1);
      var theta = Math.acos(dot);
      var r = Array.isArray(radius) ? radius[v] : radius;
      if (theta < 1e-3 || !r) { out.push(P.slice()); continue; }
      var tan = Math.tan(theta / 2);
      var t = r * tan;
      var max1 = v - 1 === 0 ? l1 : l1 / 2;
      var max2 = v + 1 === n - 1 ? l2 : l2 / 2;
      t = Math.min(t, max1, max2);
      var rr = t / tan;
      var sx = P[0] - d1x * t, sy = P[1] - d1y * t;
      var cross = d1x * d2y - d1y * d2x;
      var nx = cross > 0 ? -d1y : d1y, ny = cross > 0 ? d1x : -d1x;
      var cx = sx + nx * rr, cy = sy + ny * rr;
      var a0 = Math.atan2(sy - cy, sx - cx);
      var sweep = cross > 0 ? theta : -theta;
      var steps = Math.max(4, Math.ceil(Math.abs(sweep) * rr / 2));
      for (var k = 0; k <= steps; k++) {
        var a = a0 + sweep * (k / steps);
        out.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
      }
    }
    out.push(pts[n - 1].slice());
    return out;
  }

  /** Catmull-Rom（均匀）曲线采样 */
  function catmull(pts) {
    var out = [];
    var n = pts.length;
    for (var i = 0; i < n - 1; i++) {
      var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
      var len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      var steps = Math.max(6, Math.ceil(len / 2));
      for (var k = 0; k < steps; k++) {
        var t = k / steps, t2 = t * t, t3 = t2 * t;
        var x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
        var y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
        out.push([x, y]);
      }
    }
    out.push(pts[n - 1].slice());
    return out;
  }

  /**
   * 计算轨道空间 → 屏幕逻辑坐标的映射（等比缩放、居中）
   * rect: 传送带区域 {x,y,w,h}
   */
  Path.mapping = function (rect, space) {
    var TS = space || KS.TRACK_SPACE;
    var scale = Math.min(rect.w / TS.w, rect.h / TS.h, 1.15);
    return {
      scale: scale,
      cx: rect.x + rect.w / 2, cy: rect.y + rect.h / 2,
      map: function (p) {
        return [this.cx + (p[0] - TS.w / 2) * scale, this.cy + (p[1] - TS.h / 2) * scale];
      }
    };
  };

  /**
   * 从关卡 track 配置构建路径
   * track = { type:'polyline'|'smooth', points:[[x,y],...], radius }
   * 多段轨道可以用 segments:[{type,points,radius}, ...]，会按顺序首尾相接
   */
  Path.fromTrack = function (track, rect) {
    var m = Path.mapping(rect, track.space);
    var parts = track.segments || [track];
    var raw = [];
    parts.forEach(function (seg) {
      var pts = seg.points.map(function (p) { return m.map(p); });
      var r = (seg.radius != null ? seg.radius : 0);
      r = Array.isArray(r) ? r.map(function (x) { return x * m.scale; }) : r * m.scale;
      var dense = (seg.type === 'smooth') ? catmull(pts) : filletPolyline(pts, r);
      if (raw.length) dense.shift();
      raw = raw.concat(dense);
    });
    var path = resample(raw, 1);
    path.scale = m.scale;
    return path;
  };

  /** 闭合环形（菜单装饰用）：圆角矩形 */
  Path.roundedLoop = function (cx, cy, w, h, r) {
    var x0 = cx - w / 2, y0 = cy - h / 2, x1 = cx + w / 2, y1 = cy + h / 2;
    var pts = [[x0 + r, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0], [x0 + r + 0.01, y0]];
    var dense = filletPolyline(pts, r);
    var p = resample(dense, 1);
    p.closed = true;
    return p;
  };

  KS.Path = Path;
})(globalThis.KS);

</script>
<script>
/*
 * 寿司种类目录。关卡里用 key 引用。
 * name   ：界面显示
 * plate  ：传送带瓷盘的边沿颜色（辅助辨识）
 * colors ：消除时粒子颜色
 * 画法在 src/art/sushi-art.js 中按 key 实现。
 */
(function (KS) {
  'use strict';
  KS.SUSHI_TYPES = {
    salmon: { name: '三文鱼', plate: '#f2b8a8', colors: ['#f58a4b', '#ffd2b0', '#fff6e8'] },
    tuna:   { name: '金枪鱼', plate: '#bcd39a', colors: ['#d8394a', '#f27b84', '#fff6e8'] },
    tamago: { name: '玉子烧', plate: '#f2d48a', colors: ['#f7cf55', '#3b4a35', '#fff6e8'] },
    maki:   { name: '黄瓜卷', plate: '#b9d5c8', colors: ['#8cc152', '#2f3a2c', '#fff6e8'] },
    ebi:    { name: '甜虾',   plate: '#f4c6cf', colors: ['#f6875f', '#ffe1d2', '#e2463a'] },
    ikura:  { name: '三文鱼籽', plate: '#d8c3e6', colors: ['#ff7a2f', '#ffb36b', '#2f3a2c'] },
    inari:  { name: '豆皮寿司', plate: '#d6b98f', colors: ['#c98636', '#f2c27a', '#fff6e8'] },
    hotate: { name: '扇贝',     plate: '#a9c9e6', colors: ['#fff4e2', '#f4cdb8', '#bfe0f2'] }
  };
  /** 固定的类型顺序：开局洗牌前先按此排序，保证不同内核下同一 seed 得到同一局面（不依赖对象键顺序） */
  KS.SUSHI_ORDER = ['salmon', 'tuna', 'tamago', 'maki', 'ebi', 'ikura', 'inari', 'hotate'];
})(globalThis.KS);

</script>
<script>
/* V4: 把绝大部分竖屏留给跑道；托盘视觉收紧，触控区域单独放大。 */
(function(KS){
 'use strict';
 var W=390;
 KS.Layout={W:W,MIN_H:650,MAX_H:940,
 TRAY_W:230,TRAY_H:43,TRAY_PITCH:53,SLOT_GAP:70,
 BUFFER_W:346,BUFFER_H:56,BUFFER_SLOT_GAP:61,
 compute:function(vw,vh,safeTop,safeBottom){
  var scale=vw/W, H=vh/scale;
  if(H<650){H=650;scale=vh/H}
  if(H>940)H=940;
  var offX=(vw-W*scale)/2,offY=(vh-H*scale)/2;
  var top=(safeTop||0)/scale;
  var bottom=Math.max(8,(safeBottom||0)/scale+5);
  var L={W:W,H:H,scale:scale,offX:offX,offY:offY,top:top};
  L.btnBack={x:12,y:top+8,w:44,h:44};
  L.btnRestart={x:64,y:top+8,w:44,h:44};
  L.btnSound={x:W-57,y:top+8,w:44,h:44};
  L.btnPause={x:W-109,y:top+8,w:44,h:44};
  L.title={x:W/2,y:top+29};
  L.hud={x:0,y:top,w:W,h:68};
  L.clockPill={x:W/2-60,y:top+49,w:120,h:27};
  L.buffer={x:(W-this.BUFFER_W)/2,y:H-bottom-this.BUFFER_H,w:this.BUFFER_W,h:this.BUFFER_H};
  L.bufferLabel={x:W/2,y:L.buffer.y-4};
  L.bufferSlots=[];
  for(var i=0;i<5;i++){
   var x=W/2+(i-2)*this.BUFFER_SLOT_GAP;
   L.bufferSlots.push({cx:x,cy:L.buffer.y+this.BUFFER_H/2+2,x:x-27,y:L.buffer.y+2,w:54,h:this.BUFFER_H-2});
  }
  L.trays=[];
  var lastCenter=L.buffer.y-32;
  for(var t=0;t<3;t++){
   var cy=lastCenter-(2-t)*this.TRAY_PITCH;
   var tr={cx:W/2,cy:cy,x:(W-this.TRAY_W)/2,y:cy-this.TRAY_H/2,w:this.TRAY_W,h:this.TRAY_H,slots:[]};
   for(var k=0;k<3;k++) tr.slots.push({x:W/2+(k-1)*this.SLOT_GAP,y:cy-2});
   tr.hit={x:tr.x-36,y:cy-this.TRAY_PITCH/2,w:tr.w+72,h:this.TRAY_PITCH};
   L.trays.push(tr);
  }
  L.woodTop=L.trays[0].y-17;
  L.conveyor={x:0,y:top+77,w:W,h:L.woodTop-top-83};
  L.bufferHit={x:0,y:L.buffer.y-6,w:W,h:this.BUFFER_H+bottom+7};
  return L;
 }
 };
})(globalThis.KS);

</script>
<script>
/*
 * 纯逻辑游戏模型（无渲染、无 DOM），浏览器与 Node 测试共用。
 *
 * 每个寿司有唯一 id 和一个 loc（所在位置）：
 *   kitchen  厨房队列（出口→入口之间的不可见部分，排队等待重新上带）
 *   belt     传送带上（有弧长 s）
 *   held     被玩家手指拿着（若来自传送带，仍占着传送带上的空盘位）
 *   tray     托盘中（tray 下标 + slot 下标）
 *   buffer   暂存区（slot 下标）
 *   cleared  已消除
 * 不变量：各位置数量之和恒等于开局总数，且每个 id 只出现在一个容器中。
 */
(function (KS) {
  'use strict';

  var TRAY_COUNT = 3, TRAY_SIZE = 3, BUFFER_SIZE = 5;
  var CLEAR_DELAY = 0.62;   // 第三个寿司放入 → 真正消除 的时长（留给飞行和消除动画）

  function Model(level, path, opts) {
    opts = opts || {};
    this.level = level;
    this.path = path;
    this.L = path.length;
    var k = path.scale || 1;
    this.speed = level.speed * k;               // 关卡里的速度/间距以轨道空间计，这里换算成屏幕逻辑像素
    this.spacing = level.spacing * k;
    this.endless = level.mode === 'endless';
    this.timeLimit = this.endless ? 600 : 0;
    this.timeLeft = this.timeLimit;
    this.activeTypes = this.endless ? Object.keys(level.sushi) : [];
    this.stage = 1;
    this._lastRefill = 0;
    this.elapsed = 0;
    this.beltOffset = 0;                         // 传送带累计位移（用于画履带纹理）
    // 补货加速：传送带上寿司稀疏且厨房还有存货时，整条带子临时加速（所有盘子同速，间距不变）
    this.refillBoost = level.refillBoost != null ? level.refillBoost : 0.9;
    this.speedMul = 1;
    // 固定局面：优先用调试覆盖的 seed，其次用关卡配置里的稳定 seed；两者都没有才随机
    this.seed = opts.seed != null ? opts.seed : level.seed != null ? level.seed : (Math.random() * 1e9) | 0;
    this.rng = KS.rng(this.seed);
    // 可拿取判定：默认整段可拿；浏览器里传入“是否在屏幕内”
    this.pickRange = opts.pickRange || { start: 0, end: this.L };

    var types = [];
    var self = this;
    var typeKeys = Object.keys(level.sushi).sort(function (a, b) {
      return KS.SUSHI_ORDER.indexOf(a) - KS.SUSHI_ORDER.indexOf(b);
    });
    typeKeys.forEach(function (type) {
      var n = level.sushi[type];
      if (n % 3 !== 0) throw new Error('关卡 ' + level.id + ' 的 ' + type + ' 数量 ' + n + ' 不是 3 的倍数');
      if (!KS.SUSHI_TYPES[type]) throw new Error('未知寿司类型: ' + type);
      for (var i = 0; i < n; i++) types.push(type);
    });
    this.rng.shuffle(types);
    this.sushi = types.map(function (type, id) {
      return { id: id, type: type, loc: 'kitchen', s: -1, tray: -1, slot: -1 };
    });
    this.total = this.sushi.length;
    this.typeTotals = {};
    types.forEach(function (t) { self.typeTotals[t] = (self.typeTotals[t] || 0) + 1; });

    this.belt = [];      // 按 s 从大到小（越靠近出口越靠前）
    this.kitchen = [];
    this.trays = [];
    for (var t = 0; t < TRAY_COUNT; t++) this.trays.push({ type: null, slots: [null, null, null], clearing: false, clearT: 0 });
    this.buffer = [];
    for (var b = 0; b < BUFFER_SIZE; b++) this.buffer.push(null);
    this.held = null;    // { id, from:'belt'|'buffer', index }
    this.clearedCount = 0;
    this.matches = 0;
    this.status = 'ready';   // ready → playing → (winning →) won | lost
    this.events = [];

    // 开局：从出口附近往入口方向铺满传送带，其余在厨房排队
    var s = Math.min(this.L - this.spacing * 0.6, this.pickRange.end - this.spacing * 0.3);
    for (var i2 = 0; i2 < this.total; i2++) {
      var sh = this.sushi[i2];
      if (s >= 0) { sh.loc = 'belt'; sh.s = s; this.belt.push(sh.id); s -= this.spacing; }
      else { this.kitchen.push(sh.id); }
    }
  }

  Model.TRAY_COUNT = TRAY_COUNT; Model.TRAY_SIZE = TRAY_SIZE; Model.BUFFER_SIZE = BUFFER_SIZE;
  Model.CLEAR_DELAY = CLEAR_DELAY;

  var P = Model.prototype;

  P.emit = function (ev) { this.events.push(ev); };
  P.drainEvents = function () { var e = this.events; this.events = []; return e; };

  P.start = function () { if (this.status === 'ready') { this.status = 'playing'; this.emit({ type: 'start' }); } };

  P.isActive = function () { return this.status === 'playing' || this.status === 'winning'; };

  P.update = function (dt) {
    if (!this.isActive()) return;
    this.elapsed += dt;
    // 1) 传送带前进（稀疏时补货加速）
    var cap = Math.max(1, Math.floor(this.L / this.spacing));
    var fill = this.belt.length / cap;
    var target = this.kitchen.length ? 1 + this.refillBoost * KS.clamp((0.6 - fill) / 0.45, 0, 1) : 1;
    this.speedMul += (target - this.speedMul) * Math.min(1, dt * 1.6);
    var ds = this.speed * this.speedMul * dt;
    this.beltOffset += ds;
    for (var i = 0; i < this.belt.length; i++) this.sushi[this.belt[i]].s += ds;
    // 2) 到达出口 → 回到厨房队尾（身份不变、数量不变）
    while (this.belt.length && this.sushi[this.belt[0]].s >= this.L) {
      var id = this.belt.shift();
      var sh = this.sushi[id];
      if (sh.loc === 'held') {
        sh.s = -1;  // 手里拿着的寿司，空盘已被带走；若取消则回厨房
      } else {
        sh.loc = 'kitchen'; sh.s = -1;
        this.kitchen.push(id);
        this.emit({ type: 'exit', id: id });
      }
    }
    // 3) 入口有空位 → 厨房队首重新上带
    while (this.kitchen.length) {
      var minS = this.belt.length ? this.sushi[this.belt[this.belt.length - 1]].s : Infinity;
      if (minS < this.spacing) break;
      var nid = this.kitchen.shift();
      var ns = this.sushi[nid];
      ns.loc = 'belt';
      ns.s = this.belt.length ? KS.clamp(minS - this.spacing, 0, 4) : 0;
      this.belt.push(nid);
      this.emit({ type: 'spawn', id: nid });
    }
    // 4) 托盘消除计时
    for (var t = 0; t < this.trays.length; t++) {
      var tr = this.trays[t];
      if (!tr.clearing) continue;
      tr.clearT += dt;
      if (tr.clearT >= CLEAR_DELAY) {
        var ids = tr.slots.slice();
        for (var k = 0; k < ids.length; k++) {
          var c = this.sushi[ids[k]];
          c.loc = 'cleared'; c.tray = -1; c.slot = -1;
        }
        this.clearedCount += ids.length;
        this.matches++;
        this.emit({ type: 'cleared', tray: t, sushiType: tr.type, ids: ids });
        tr.type = null; tr.slots = [null, null, null]; tr.clearing = false; tr.clearT = 0;
        if (!this.endless && this.clearedCount === this.total) { this.status = 'won'; this.emit({ type: 'win' }); }
      }
    }
    // 5) 持续补货与寿司种类进阶。每个寿司仍有唯一身份，库存数随新货增加。
    if (this.endless && this.status === 'playing') this.endlessRestock();
    // 6) 仅无尽模式有 10 分钟结算；教学和自由选图只记录正向用时。
    if (this.endless && this.status === 'playing') {
      this.timeLeft -= dt;
      if (this.timeLeft <= 0) {
        this.timeLeft = 0;
        if (this.held) this.cancelHeld();
        this.status = 'ended';
        this.emit({ type: 'end', reason: 'time' });
      }
    }
  };

  /** 用寿司消除总量决定种类解锁：4 → 5 → 6 → 7 → 8。 */
  P.endlessRestock = function () {
    if (!this.endless || this.status !== 'playing') return;
    var gates=this.level.unlockAt||[], additions=this.level.unlockTypes||[];
    while(this.stage<=gates.length && this.clearedCount>=gates[this.stage-1]) {
      var type=additions[this.stage-1];
      if(type && this.activeTypes.indexOf(type)<0){
        this.activeTypes.push(type);
        this.addBatch(type, 6);
        this.emit({type:'unlock', sushiType:type, stage:this.stage+1});
      }
      this.stage++;
    }
    // 玩家把寿司放进托盘/暂存区时就补货，避免出现长时间空带。
    // 按类均衡补货，不追求让玩家失败；成绩取决于单位时间的消除量。
    var inFlow=this.kitchen.length+this.belt.length;
    var target=20+this.activeTypes.length;
    if(inFlow >= target) return;
    var stock={}, i;
    for(i=0;i<this.activeTypes.length;i++)stock[this.activeTypes[i]]=0;
    for(i=0;i<this.sushi.length;i++) {
      var s=this.sushi[i];
      if(s.loc!=='cleared')stock[s.type]=(stock[s.type]||0)+1;
    }
    var candidates=this.activeTypes.slice(), self=this;
    candidates.sort(function(a,b){return (stock[a]||0)-(stock[b]||0)});
    // 混入轻微变化但优先库存少的寿司，防止新增种类被长时间淹没
    var k=Math.min(2,candidates.length), chosen=candidates[this.rng.int(k)];
    this.addBatch(chosen,3);
  };

  /** 运行期间增加一小组寿司；全部进入厨房，沿真实入口依次出场。 */
  P.addBatch = function(type,count){
    if(!KS.SUSHI_TYPES[type])throw Error('未知寿司种类 '+type);
    for(var i=0;i<count;i++){
      var id=this.sushi.length;
      this.sushi.push({id:id,type:type,loc:'kitchen',s:-1,tray:-1,slot:-1});
      this.kitchen.push(id);
    }
    this.total+=count;
    this.typeTotals[type]=(this.typeTotals[type]||0)+count;
  };

  /** 提前结束无尽对局，不算失败，按照当前消除数结算。 */
  P.finishEndless=function(reason){
    if(!this.endless || this.status==='ended')return false;
    if(this.held)this.cancelHeld();
    this.status='ended';
    this.emit({type:'end',reason:reason||'manual'});
    return true;
  };

  // ---------- 查询 ----------

  P.isPickableOnBelt = function (id) {
    var sh = this.sushi[id];
    return sh.loc === 'belt' && sh.s >= this.pickRange.start && sh.s <= this.pickRange.end;
  };

  P.trayAccepts = function (t, type) {
    var tr = this.trays[t];
    if (tr.clearing) return 'clearing';
    if (tr.slots.indexOf(null) < 0) return 'full';
    if (tr.type !== null && tr.type !== type) return 'type';
    return 'ok';
  };

  P.freeBufferSlot = function () { return this.buffer.indexOf(null); };

  /** 自动选择目标托盘：同类型未满 > 空托盘 */
  P.autoTray = function (type) {
    for (var t = 0; t < this.trays.length; t++) {
      if (this.trays[t].type === type && this.trayAccepts(t, type) === 'ok') return t;
    }
    for (var u = 0; u < this.trays.length; u++) {
      if (this.trays[u].type === null && this.trayAccepts(u, type) === 'ok') return u;
    }
    return -1;
  };

  // ---------- 操作 ----------

  /** 拿起：来自传送带或暂存区。返回是否成功 */
  P.pick = function (id) {
    if (this.status !== 'playing' || this.held) return false;
    var sh = this.sushi[id];
    if (sh.loc === 'belt') {
      if (!this.isPickableOnBelt(id)) return false;
      sh.loc = 'held';           // 仍留在 belt 数组里占位（空盘继续走）
      this.held = { id: id, from: 'belt', index: -1 };
    } else if (sh.loc === 'buffer') {
      this.buffer[sh.slot] = null;
      this.held = { id: id, from: 'buffer', index: sh.slot };
      sh.loc = 'held'; sh.slot = -1;
    } else return false;
    this.emit({ type: 'pick', id: id, from: this.held.from });
    return true;
  };

  /** 把手里的寿司从原来源中移除（成功放置时调用） */
  P._detachHeld = function () {
    var h = this.held, sh = this.sushi[h.id];
    if (h.from === 'belt' && sh.s >= 0) {
      var i = this.belt.indexOf(h.id);
      if (i >= 0) this.belt.splice(i, 1);
    }
    sh.s = -1;
    this.held = null;
    return sh;
  };

  P._putTray = function (sh, t) {
    var tr = this.trays[t];
    var slot = tr.slots.indexOf(null);
    tr.slots[slot] = sh.id;
    tr.type = sh.type;
    sh.loc = 'tray'; sh.tray = t; sh.slot = slot;
    this.emit({ type: 'place', id: sh.id, to: 'tray', tray: t, slot: slot });
    if (tr.slots.indexOf(null) < 0) {
      tr.clearing = true; tr.clearT = 0;
      this.emit({ type: 'match', tray: t, sushiType: tr.type });
      // 场上已无任何未处理寿司 → 收尾阶段，冻结计时
      var pending = 0;
      for (var i = 0; i < this.sushi.length; i++) {
        var l = this.sushi[i].loc;
        if (l === 'cleared') continue;
        if (l === 'tray' && this.trays[this.sushi[i].tray].clearing) continue;
        pending++;
      }
      if (!this.endless && pending === 0 && this.status === 'playing') this.status = 'winning';
    }
  };

  P._putBuffer = function (sh, b) {
    this.buffer[b] = sh.id;
    sh.loc = 'buffer'; sh.slot = b; sh.tray = -1;
    this.emit({ type: 'place', id: sh.id, to: 'buffer', slot: b });
  };

  /**
   * 放下手里的寿司
   * target: {kind:'tray', index} | {kind:'buffer', index?} | null(取消)
   * 返回 {ok, reason?}
   */
  P.drop = function (target) {
    if (!this.held) return { ok: false, reason: 'none' };
    var sh = this.sushi[this.held.id];
    if (!target) { this.cancelHeld(); return { ok: false, reason: 'cancel' }; }
    if (target.kind === 'tray') {
      var why = this.trayAccepts(target.index, sh.type);
      if (why !== 'ok') {
        this.emit({ type: 'reject', id: sh.id, tray: target.index, reason: 'tray-' + why });
        this.cancelHeld();
        return { ok: false, reason: 'tray-' + why };
      }
      this._detachHeld();
      this._putTray(sh, target.index);
      return { ok: true };
    }
    if (target.kind === 'buffer') {
      var b = target.index;
      if (b == null || b < 0 || this.buffer[b] !== null) b = this.nearestFreeBuffer(target.index);
      if (b < 0) {
        this.emit({ type: 'reject', id: sh.id, reason: 'buffer-full' });
        this.cancelHeld();
        return { ok: false, reason: 'buffer-full' };
      }
      this._detachHeld();
      this._putBuffer(sh, b);
      return { ok: true };
    }
    this.cancelHeld();
    return { ok: false, reason: 'cancel' };
  };

  P.nearestFreeBuffer = function (pref) {
    if (pref == null || pref < 0) return this.freeBufferSlot();
    var best = -1, bd = 99;
    for (var i = 0; i < this.buffer.length; i++) {
      if (this.buffer[i] === null && Math.abs(i - pref) < bd) { bd = Math.abs(i - pref); best = i; }
    }
    return best;
  };

  /** 轻点：自动放置。传送带寿司：同类托盘 > 空托盘 > 暂存区；暂存区寿司：同类托盘 > 空托盘 */
  P.autoPlaceHeld = function () {
    if (!this.held) return { ok: false, reason: 'none' };
    var sh = this.sushi[this.held.id];
    var t = this.autoTray(sh.type);
    if (t >= 0) return this.drop({ kind: 'tray', index: t });
    if (this.held.from === 'belt') {
      if (this.freeBufferSlot() >= 0) return this.drop({ kind: 'buffer' });
      this.emit({ type: 'reject', id: sh.id, reason: 'all-full' });
      this.cancelHeld();
      return { ok: false, reason: 'all-full' };
    }
    this.emit({ type: 'reject', id: sh.id, reason: 'no-tray' });
    this.cancelHeld();
    return { ok: false, reason: 'no-tray' };
  };

  /** 取消：回到原处（传送带空盘还在 → 回盘；空盘已离开 → 回厨房排队；暂存区 → 回原格） */
  P.cancelHeld = function () {
    if (!this.held) return;
    var h = this.held, sh = this.sushi[h.id];
    this.held = null;
    if (h.from === 'belt') {
      if (sh.s >= 0 && this.belt.indexOf(sh.id) >= 0) { sh.loc = 'belt'; }
      else { sh.loc = 'kitchen'; sh.s = -1; this.kitchen.push(sh.id); }
    } else {
      var b = this.buffer[h.index] === null ? h.index : this.freeBufferSlot();
      if (b >= 0) { this.buffer[b] = sh.id; sh.loc = 'buffer'; sh.slot = b; }
      else { sh.loc = 'kitchen'; sh.s = -1; this.kitchen.push(sh.id); }
    }
    this.emit({ type: 'return', id: sh.id });
  };

  /** 便捷：轻点某个寿司 = 拿起 + 自动放置 */
  P.tap = function (id) {
    if (!this.pick(id)) return { ok: false, reason: 'cannot-pick' };
    return this.autoPlaceHeld();
  };

  // ---------- 统计与不变量 ----------

  P.counts = function () {
    var c = { kitchen: 0, belt: 0, held: 0, tray: 0, buffer: 0, cleared: 0 };
    for (var i = 0; i < this.sushi.length; i++) c[this.sushi[i].loc]++;
    c.total = this.total;
    c.remaining = this.total - c.cleared;
    return c;
  };

  /** 返回违反不变量的描述数组（空数组 = 一切正常） */
  P.checkInvariants = function () {
    var err = [];
    var self = this;
    var seen = {};
    function mark(id, where) {
      if (id === null) return;
      if (seen[id] !== undefined) err.push('寿司 #' + id + ' 同时出现在 ' + seen[id] + ' 和 ' + where);
      seen[id] = where;
    }
    var lastS = Infinity;
    this.belt.forEach(function (id, i) {
      mark(id, 'belt');
      var sh = self.sushi[id];
      if (sh.loc !== 'belt' && sh.loc !== 'held') err.push('belt 中的 #' + id + ' loc=' + sh.loc);
      if (sh.s < 0 || sh.s >= self.L + 1e-6) err.push('#' + id + ' s 越界 ' + sh.s);
      if (i > 0 && lastS - sh.s < self.spacing - 1e-3) err.push('传送带上 #' + id + ' 与前一个重叠 (间距 ' + (lastS - sh.s).toFixed(2) + ')');
      lastS = sh.s;
    });
    this.kitchen.forEach(function (id) { mark(id, 'kitchen'); if (self.sushi[id].loc !== 'kitchen') err.push('kitchen 中 #' + id + ' loc=' + self.sushi[id].loc); });
    this.trays.forEach(function (tr, t) {
      var n = 0;
      tr.slots.forEach(function (id, s) {
        if (id === null) return;
        n++;
        mark(id, 'tray' + t);
        var sh = self.sushi[id];
        if (sh.loc !== 'tray' || sh.tray !== t || sh.slot !== s) err.push('托盘 ' + t + ' 槽 ' + s + ' 的 #' + id + ' 状态不一致');
        if (sh.type !== tr.type) err.push('托盘 ' + t + ' 混入了不同种类');
      });
      if (n === 0 && tr.type !== null) err.push('空托盘 ' + t + ' 仍锁定类型');
      if (tr.clearing && n !== 3) err.push('托盘 ' + t + ' 消除中但不足 3 个');
    });
    this.buffer.forEach(function (id, b) {
      if (id === null) return;
      mark(id, 'buffer');
      var sh = self.sushi[id];
      if (sh.loc !== 'buffer' || sh.slot !== b) err.push('暂存区 ' + b + ' 的 #' + id + ' 状态不一致');
    });
    if (this.held) {
      var hs = this.sushi[this.held.id];
      if (hs.loc !== 'held') err.push('held 状态不一致');
      if (!(this.held.from === 'belt' && seen[this.held.id] === 'belt')) mark(this.held.id, 'held');
    }
    var c = this.counts();
    if (c.kitchen + c.belt + c.held + c.tray + c.buffer + c.cleared !== this.total) err.push('数量守恒失败');
    if (c.held !== (this.held ? 1 : 0)) err.push('held 计数不一致');
    if (c.cleared !== this.clearedCount) err.push('已消除计数不一致');
    if (c.kitchen !== this.kitchen.length) err.push('厨房计数不一致');
    var beltHeld = this.held && this.held.from === 'belt' && this.belt.indexOf(this.held.id) >= 0 ? 1 : 0;
    if (c.belt + beltHeld !== this.belt.length) err.push('传送带计数不一致');
    // 每种寿司的总数不变，已消除的每种都是 3 的倍数
    var perType = {}, clearedType = {};
    this.sushi.forEach(function (sh) {
      perType[sh.type] = (perType[sh.type] || 0) + 1;
      if (sh.loc === 'cleared') clearedType[sh.type] = (clearedType[sh.type] || 0) + 1;
    });
    Object.keys(this.typeTotals).forEach(function (t) {
      if (perType[t] !== self.typeTotals[t]) err.push(t + ' 总数变化');
      if ((clearedType[t] || 0) % 3 !== 0) err.push(t + ' 已消除数不是 3 的倍数');
    });
    for (var id = 0; id < this.total; id++) {
      var l = this.sushi[id].loc;
      if (l !== 'cleared' && seen[id] === undefined) err.push('寿司 #' + id + ' 丢失（loc=' + l + '）');
    }
    return err;
  };

  KS.Model = Model;
})(globalThis.KS);

</script>

<script>
/*

 *   ks2_time_<mapKey>   最佳用时（秒，保留 1 位小数）

 P.drawHome=function(ctx){

    ctx.beginPath();ctx.arc(c.x+52,c.y+c.h/2,32,0,7);ctx.fillStyle=i===1?'#d77959':'#edd5b0';ctx.fill();

    ctx.strokeStyle='#b87953';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(c.x+c.w-29,c.y+c.h/2-8);ctx.lineTo(c.x+c.w-21,c.y+c.h/2);ctx.lineTo(c.x+c.w-29,c.y+c.h/2+8);ctx.stroke();

 P.mapCards=function(){

   var L=this.L,self=this;
   var back={id:'back',x:L.btnBack.x,y:L.btnBack.y,w:L.btnBack.w,h:L.btnBack.h,action:function(){self.app.showMenu('home')}};

   cards.forEach(function(c,i){
    self.buttons.push(c);
    ctx.save();Art.roundRect(ctx,c.x+2,c.y+5,c.w,c.h,18);ctx.fillStyle='rgba(110,70,30,.18)';ctx.fill();
    Art.roundRect(ctx,c.x,c.y,c.w,c.h,18);ctx.fillStyle='#fffaf0';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2.4;ctx.stroke();

   var prev={id:'prev',x:30,y:pageH-13,w:90,h:50,action:function(){if(self.page>0){self.page--;self.app.menuPage=self.page}}};
   var next={id:'next',x:270,y:pageH-13,w:90,h:50,action:function(){if(self.page<total-1){self.page++;self.app.menuPage=self.page}}};
   this.buttons.push(prev,next);
   if(this.page>0)Menu.drawButton(ctx,prev,'上一页',false,this.pressed==='prev');
   if(this.page<total-1)Menu.drawButton(ctx,next,'下一页',false,this.pressed==='next');
   Art.text(ctx,(this.page+1)+' / '+total,L.W/2,pageH+13,15,'#69452b');
 };
 P.render=function(ctx){
   ctx.drawImage(this.staticLayer,0,0,this.L.W,this.L.H);this.buttons=[];

 };
 P.hit=function(x,y){for(var i=this.buttons.length-1;i>=0;i--){var b=this.buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b}return null};
 P.onDown=function(x,y){var b=this.hit(x,y);this.pressed=b?b.id:null};

<script>
/*
 * 关卡进行场景：把纯逻辑模型(KS.Model)可视化，并处理触摸/鼠标操作。
 * 视觉层只“读取”模型状态并做插值动画，所有规则判断都在模型里，
 * 因此动画再花哨也不会造成寿司复制或丢失。
 */
(function (KS) {
  'use strict';
  var Art = KS.Art, Ease = KS.Ease, INK = Art.INK;
  var TAP_SLOP = 10;          // 移动小于此距离视为“点一下”
  var HOLD_LIFT_Y = 30;       // 拖动时寿司显示在手指上方，避免被手指挡住
  var PRAISE = ['好吃！', '真棒！', '完美！', '鲜美！', '漂亮！'];

  /**
   * cfg：主线关卡（KS.LEVELS）或自由地图（KS.FREE_MAPS）的配置；cfg.mode 决定结算后去哪里。
   * seed：仅调试覆盖；正常游玩为 undefined，使用 cfg.seed 固定局面。
   */
  function PlayScene(app, cfg, seed) {
    this.app = app;
    this.cfg = cfg;
    this.level = cfg;
    this.levelIndex = cfg.mode === 'tutorial' ? 0 : -1;
    this.seed = seed;
    // 第 1 关新手教学：只在第一次进入时出现，点击任意处开始
    this.tutorial = cfg.mode === 'tutorial' && !KS.Progress.tutorialDone;
    this.fx = new KS.Fx();
    this.time = 0;
    this.readyT = 0;
    this.result = null;       // {win, stars, t}
    this.buttons = [];
    this.pointer = null;
    this.lastClear = -9; this.combo = 0;
    this.lastTick = -1;
    this.hintDone = !this.tutorial;
    this.trayFx = [0, 1, 2].map(function () { return { shake: 0, bounce: 0, flash: 0 }; });
    this.ghosts = [];
    this.layoutDone = false;
    this.relayout();
    this.model = new KS.Model(this.level, this.path, { seed: seed, pickRange: this.pickRange });
    this.views = this.model.sushi.map(function () { return { x: 0, y: 0, k: 0, key: null, fl: null, land: 9, shake: 0, lift: 0, rot: 0, vx: 0, vy: 0, show: false }; });
  }

  var P = PlayScene.prototype;

  /** 布局变化（旋转/窗口缩放）时重建路径与静态层。逻辑状态用弧长保存，不受影响。 */
  P.relayout = function () {
    var app = this.app, L = this.L = app.layout;
    var path = KS.Path.fromTrack(this.level.track, L.conveyor);
    if (this.model) {
      // 屏幕尺寸改变：按比例换算弧长（路径形状相同，只是缩放）
      var ratio = path.length / this.path.length;
      this.model.path = path; this.model.L = path.length;
      this.model.speed *= ratio; this.model.spacing *= ratio;
      this.model.sushi.forEach(function (s) { if (s.s >= 0) s.s *= ratio; });
    }
    this.path = path;
    var k = path.scale;
    this.beltW = this.level.beltWidth * k;
    this.wallW = this.level.wall * k;
    this.plateK = this.beltW * 0.43 / 50;
    this.sushiK = this.plateK * 0.84;
    this.trayK = 0.49;
    this.bufPlateK = 0.41;
    this.bufK = 0.38;
    this.computeRanges();
    if (this.model) this.model.pickRange = this.pickRange;
    this.buildStatic();
  };

  /**
   * 可拿取范围：屏幕内（留 22 边距），且避开画面内出入口门帘下方的 26 像素。
   * innerStart / innerEnd：入口/出口落在画面内（如回字螺旋的中心出口），需要淡入淡出。
   */
  P.computeRanges = function () {
    var L = this.L, path = this.path, GATE = 26;
    var screen = { x: 0, y: 0, w: L.W, h: L.H };
    this.screenRange = path.visibleRange(screen, 0);
    var vis = path.visibleRange(screen, 22) || { start: 0, end: path.length };
    this.pickRange = { start: Math.max(vis.start, GATE), end: Math.min(vis.end, path.length - GATE) };
    this.innerStart = !!this.screenRange && this.screenRange.start < 2;
    this.innerEnd = !!this.screenRange && this.screenRange.end > path.length - 2;
  };

  P.buildStatic = function () {
    var app = this.app, L = this.L, dpr = app.pixelRatio;
    var res = L.scale * dpr;
    Art.setResolution(Math.max(this.plateK, this.trayK) * 1.35 * res);
    var c = this.staticLayer = Art.makeCanvas(L.W * res, L.H * res);
    var ctx = c.getContext('2d');
    ctx.scale(res, res);
    Art.paper(ctx, 0, 0, L.W, L.woodTop);
    Art.wood(ctx, 0, L.woodTop, L.W, L.H - L.woodTop);
    this.drawGardenBackdrop(ctx);
    Art.belt(ctx, this.path, this.beltW, this.wallW, L.W, L.H, res);
    Art.beltArrows(ctx, this.path, this.beltW, this.wallW, { w: L.W, y: L.conveyor.y, h: L.conveyor.h });
    this.drawDecorStatic(ctx);
    Art.bufferPanel(ctx, L.buffer, L.bufferSlots);
    for (var i = 0; i < 5; i++) Art.slot(ctx, L.bufferSlots[i].cx, L.bufferSlots[i].cy + 2, 22, 14);
    /* 暂存槽已经足够直观，不额外标文字 */
    // 出入口门帘
    var g = this.gateLayer = Art.makeCanvas(L.W * res, L.H * res);
    var gctx = g.getContext('2d'); gctx.scale(res, res);
    var span = this.beltW + this.wallW * 2 + 8, tmp = {};
    if (this.screenRange) {
      // 屏幕边缘的端点：门帘贴边；画面内的端点（螺旋中心出口）：门帘盖住轨道末端
      var ends = [[this.innerStart ? 13 : this.screenRange.start + 11, '入口'], [this.innerEnd ? this.path.length - 13 : this.screenRange.end - 11, '出口']];
      var self = this;
      ends.forEach(function (e) {
        self.path.at(e[0], tmp);
        Art.gate(gctx, tmp.x, tmp.y, Math.atan2(tmp.ty, tmp.tx), span, e[1]);
      });
    }
    this.trays = [0, 1, 2].map(function (i) { return Art.traySprite(i, L.TRAY_W || KS.Layout.TRAY_W, KS.Layout.TRAY_H, res); });
  };

  P.drawGardenBackdrop=function(ctx){
    if(this.cfg.mode!=='endless' && this.cfg.key!=='free-garden' && this.cfg.key!=='free-maple')return;
    var L=this.L,m=KS.Path.mapping(L.conveyor,this.cfg.track.space),c=m.map([192,260]);
    var x=c[0],y=c[1],k=m.scale;
    ctx.save();ctx.translate(x,y);ctx.scale(k,k);
    // 枯山水庭院+小池塘。完全在跑道下方，不覆盖可触摸寿司。
    ctx.fillStyle='rgba(150,172,113,.16)';ctx.beginPath();ctx.ellipse(0,3,104,78,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8caeaa';ctx.strokeStyle='#a0a67d';ctx.lineWidth=5;
    ctx.beginPath();ctx.ellipse(-13,18,64,27,-.09,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,245,219,.55)';ctx.lineWidth=2;
    for(var i=0;i<3;i++){ctx.beginPath();ctx.ellipse(-13,18,24+i*12,8+i*5,0,Math.PI*.25,Math.PI*.95);ctx.stroke()}
    ctx.fillStyle='#657f46';for(var n=0;n<15;n++){var a=n*2.4,r=65+(n%4)*9;ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r*.72,3+(n%3)*2,0,Math.PI*2);ctx.fill()}
    // 粉色樱花树，保持温暖手绘笔触
    ctx.strokeStyle='#8c593c';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(20,15);ctx.lineTo(17,-26);ctx.lineTo(-12,-49);ctx.moveTo(17,-22);ctx.lineTo(47,-51);ctx.stroke();
    for(var j=0;j<24;j++){var ax=(j*37)%109-40,ay=-55+Math.sin(j*2.4)*19;KS.Art.sakura(ctx,ax,ay,4+(j%3),j%2?'#f3a6b4':'#f8c9ca')}
    ctx.restore();
  };

  P.drawDecorStatic = function (ctx) {
    var m = KS.Path.mapping(this.L.conveyor, this.level.track.space);
    var self = this;
    this.decor = (this.level.decor || []).map(function (d) {
      var p = m.map([d.x, d.y]);
      var o = { kind: d.kind, x: p[0], y: p[1], w: (d.w || 0) * m.scale, h: (d.h || 0) * m.scale, text: d.text };
      if (d.kind === 'menu') {
        var x = o.x - o.w / 2, y = o.y - o.h / 2;
        ctx.save();
        Art.roundRect(ctx, x + 2, y + 4, o.w, o.h, 10); ctx.fillStyle = 'rgba(110,60,25,0.25)'; ctx.fill();
        Art.roundRect(ctx, x, y, o.w, o.h, 10);
        ctx.fillStyle = '#b97b48'; ctx.fill(); ctx.lineWidth = 2.6; ctx.strokeStyle = INK; ctx.stroke();
        Art.roundRect(ctx, x + 6, y + 6, o.w - 12, o.h - 12, 6);
        ctx.fillStyle = '#fbf0da'; ctx.fill(); ctx.lineWidth = 1.6; ctx.stroke();
        // 挂绳
        ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(x + 18, y + 3, 3, 0, Math.PI * 2); ctx.arc(x + o.w - 18, y + 3, 3, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        Art.text(ctx, '今日菜单', o.x, y + 17, 12, '#8a3b2a');
      } else if (d.kind === 'tip') {
        var lines = (d.text || '').split('\n');
        lines.forEach(function (ln, i) {
          Art.text(ctx, ln, o.x, o.y + (i - (lines.length - 1) / 2) * 22, 13.5, '#7a5236');
        });
        ctx.save();
        ctx.strokeStyle = 'rgba(200,90,60,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        var hw = 132 * m.scale, hh = lines.length * 11 + 6;
        ctx.beginPath();
        ctx.moveTo(o.x - hw + 8, o.y - hh); ctx.lineTo(o.x - hw, o.y - hh); ctx.lineTo(o.x - hw, o.y - hh + 8);
        ctx.moveTo(o.x + hw - 8, o.y + hh); ctx.lineTo(o.x + hw, o.y + hh); ctx.lineTo(o.x + hw, o.y + hh - 8);
        ctx.stroke(); ctx.restore();
      }
      return o;
    });
    void self;
  };

  // ---------------- 位置计算 ----------------

  P.anchorOf = function (sh, out) {
    var L = this.L;
    out.plate = 0;
    switch (sh.loc) {
      case 'belt':
        this.path.at(sh.s, out); out.k = this.sushiK; out.plate = this.plateK; out.show = true; return out;
      case 'tray': {
        var sl = L.trays[sh.tray].slots[sh.slot];
        out.x = sl.x; out.y = sl.y + 4; out.k = this.trayK; out.show = true; return out;
      }
      case 'buffer': {
        var b = L.bufferSlots[sh.slot];
        out.x = b.cx; out.y = b.cy; out.k = this.bufK; out.plate = this.bufPlateK; out.show = true; return out;
      }
      case 'held':
        if (this.pointer) { out.x = this.pointer.x; out.y = this.pointer.y - HOLD_LIFT_Y; }
        out.k = this.sushiK * 1.22; out.plate = 0; out.show = true; return out;
      default:
        out.show = false; return out;
    }
  };

  // ---------------- 更新 ----------------

  P.update = function (dt) {
    this.time += dt;
    var m = this.model;
    // 存档是异步读取的：若读完发现教学已看过（例如通过 ?level=1 直接进入），收起教学卡
    if (this.tutorial && KS.Progress.tutorialDone) { this.tutorial = false; this.hintDone = true; }
    if (m.status === 'ready' && !this.tutorial) {
      this.readyT += dt;
      if (this.readyT >= 1.25) { m.start(); KS.Sfx.play('go'); }
    }
    if (!this.app.paused) m.update(dt);
    this.handleEvents(m.drainEvents());
    // 倒计时提示音
    if (m.endless && m.status === 'playing' && m.timeLeft <= 10) {
      var sec = Math.ceil(m.timeLeft);
      if (sec !== this.lastTick) { this.lastTick = sec; KS.Sfx.play('tick'); }
    }
    this.updateViews(dt);
    this.fx.update(dt);
    for (var i = 0; i < 3; i++) {
      var tf = this.trayFx[i];
      tf.shake = Math.max(0, tf.shake - dt); tf.bounce = Math.max(0, tf.bounce - dt); tf.flash = Math.max(0, tf.flash - dt);
    }
    for (var g = this.ghosts.length - 1; g >= 0; g--) {
      var gh = this.ghosts[g];
      gh.life += dt;
      if (gh.s != null) gh.s += m.isActive() ? m.speed * m.speedMul * dt : 0;
      if (gh.life > 0.35) this.ghosts.splice(g, 1);
    }
    if (this.result) this.result.t += dt;
  };

  P.updateViews = function (dt) {
    var m = this.model, tmp = this._tmp || (this._tmp = {});
    for (var i = 0; i < m.sushi.length; i++) {
      if (!this.views[i]) this.views[i] = { x:0,y:0,k:0,key:null,fl:null,land:9,shake:0,lift:0,rot:0,vx:0,vy:0,show:false };
      var sh = m.sushi[i], v = this.views[i];
      var key = sh.loc + ':' + sh.tray + ':' + sh.slot;
      this.anchorOf(sh, tmp);
      if (v.key !== key) {
        var prev = v.key ? v.key.split(':')[0] : null;
        if (prev === null || sh.loc === 'kitchen' || sh.loc === 'cleared' || (prev === 'kitchen' && sh.loc === 'belt')) {
          v.fl = null;
          if (sh.loc === 'kitchen' && prev === 'held') this.fx.puff(v.x, v.y);
        } else if (sh.loc === 'held') {
          v.fl = null; v.lift = 0;
          if (prev === 'belt') v.heldFromBelt = true;
          if (prev === 'buffer') this.ghosts.push({ x: v.x, y: v.y, k: this.bufPlateK, life: 0 });
        } else {
          // 从当前位置飞向新目标
          var dist = Math.hypot(tmp.x - v.x, tmp.y - v.y);
          v.fl = { x: v.x, y: v.y, k: v.k, t: 0, dur: KS.clamp(0.16 + dist / 1400, 0.2, 0.42), h: 26 + dist * 0.18, dir: tmp.x > v.x ? 1 : -1, plateFrom: v.plateNow || 0 };
          if (prev === 'belt' && sh.loc !== 'held') {
            // 直接点走：空盘留在传送带上淡出
            var st = this.lastBeltS[i];
            if (st != null) this.ghosts.push({ s: st, k: this.plateK, life: 0 });
          }
          if (prev === 'held' && v.heldFromBelt && sh.loc !== 'belt') {
            if (this.lastBeltS[i] != null && this.lastBeltS[i] >= 0) this.ghosts.push({ s: this.lastBeltS[i], k: this.plateK, life: 0 });
          }
          if (prev === 'buffer' && sh.loc !== 'held') this.ghosts.push({ x: v.x, y: v.y, k: this.bufPlateK, life: 0 });
          if (sh.loc !== 'held') v.heldFromBelt = false;
        }
        v.key = key;
        if (prev === null || (prev === 'kitchen' && sh.loc === 'belt')) { v.x = tmp.x; v.y = tmp.y; v.k = tmp.k; }
      }
      this.lastBeltS = this.lastBeltS || [];
      this.lastBeltS[i] = sh.s >= 0 ? sh.s : this.lastBeltS[i];
      if (sh.loc === 'kitchen') this.lastBeltS[i] = null;
      v.show = tmp.show;
      v.shake = Math.max(0, v.shake - dt);
      if (!tmp.show) continue;
      if (sh.loc === 'held') {
        // 弹簧跟随手指 + 根据速度倾斜
        v.lift = Math.min(1, v.lift + dt * 7);
        var kx = 1 - Math.pow(0.0005, dt);
        var nx = v.x + (tmp.x - v.x) * kx, ny = v.y + (tmp.y - v.y) * kx;
        v.vx = (nx - v.x) / Math.max(dt, 1e-3); v.vy = (ny - v.y) / Math.max(dt, 1e-3);
        v.x = nx; v.y = ny;
        v.rot += (KS.clamp(v.vx * 0.0009, -0.35, 0.35) - v.rot) * Math.min(1, dt * 12);
        v.k += (tmp.k - v.k) * Math.min(1, dt * 14);
        v.plateNow = 0;
        continue;
      }
      v.rot *= Math.pow(0.001, dt);
      v.lift = Math.max(0, v.lift - dt * 5);
      if (v.fl) {
        var f = v.fl;
        f.t += dt;
        var p = Math.min(1, f.t / f.dur), e = Ease.inOutQuad(p);
        var cx = (f.x + tmp.x) / 2, cy = Math.min(f.y, tmp.y) - f.h;
        var a = 1 - e;
        v.x = a * a * f.x + 2 * a * e * cx + e * e * tmp.x;
        v.y = a * a * f.y + 2 * a * e * cy + e * e * tmp.y;
        v.k = KS.lerp(f.k, tmp.k, e) * (1 + 0.16 * Math.sin(Math.PI * p));
        v.flRot = Math.sin(Math.PI * p) * 0.22 * f.dir;
        v.plateNow = tmp.plate ? KS.lerp(f.plateFrom, tmp.plate, e) : 0;
        if (p >= 1) {
          v.fl = null; v.land = 0; v.flRot = 0;
          if (sh.loc === 'tray') { this.fx.puff(tmp.x, tmp.y + 10); KS.Sfx.play('place'); }
          else if (sh.loc === 'buffer') { this.fx.puff(tmp.x, tmp.y + 10); KS.Sfx.play('buffer'); }
        }
      } else {
        v.x = tmp.x; v.y = tmp.y; v.k = tmp.k; v.plateNow = tmp.plate;
