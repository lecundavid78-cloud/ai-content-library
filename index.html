      v.land += dt;
    }
  };

  P.handleEvents = function (evs) {
    var m = this.model, L = this.L, self = this;
    evs.forEach(function (e) {
      if (e.type === 'reject') {
        KS.Sfx.play('reject');
        self.views[e.id].shake = 0.35;
        var sh = m.sushi[e.id], name = KS.SUSHI_TYPES[sh.type].name;
        if (e.tray != null) {
          var tr = L.trays[e.tray], mt = m.trays[e.tray];
          self.trayFx[e.tray].shake = 0.4; self.trayFx[e.tray].flash = 0.4;
          var msg = e.reason === 'tray-type' ? '这个托盘只放「' + KS.SUSHI_TYPES[mt.type].name + '」' : e.reason === 'tray-clearing' ? '正在消除，稍等一下' : '托盘满了';
          self.fx.toast(tr.cx, tr.y - 14, msg);
        } else if (e.reason === 'buffer-full') {
          self.fx.toast(L.W / 2, L.buffer.y - 30, '暂存区满了');
        } else if (e.reason === 'all-full') {
          self.fx.toast(L.W / 2, L.trays[0].y - 18, '没有托盘能放「' + name + '」，暂存区也满了');
        } else if (e.reason === 'no-tray') {
          self.fx.toast(L.W / 2, L.buffer.y - 30, '没有可放「' + name + '」的托盘');
        }
      } else if (e.type === 'pick') {
        KS.Sfx.play('pick');
      } else if (e.type === 'place') {
        self.hintDone = true;
      } else if (e.type === 'cleared') {
        var t = L.trays[e.tray];
        var info = KS.SUSHI_TYPES[e.sushiType];
        self.fx.burst(t.cx, t.cy - 6, info.colors.concat(['#f6b3bf', '#9dbb6c']), true);
        if (self.time - self.lastClear < 3) self.combo++; else self.combo = 0;
        self.lastClear = self.time;
        self.fx.text(t.cx, t.cy - 30, self.combo > 0 ? '连击 ×' + (self.combo + 1) : PRAISE[(m.matches - 1) % PRAISE.length], '#fff6e6', self.combo > 0 ? 24 : 22);
        self.fx.text(t.cx + 92, t.cy - 10, '+3', '#ffd25a', 18);
        self.trayFx[e.tray].bounce = 0.45;
        KS.Sfx.play('match', self.combo);
        KS.Platform.vibrate();
      } else if (e.type === 'win') {
        var stars = m.elapsed <= (self.cfg.star3 || 35) ? 3 : m.elapsed <= (self.cfg.star2 || 70) ? 2 : 1;
        var prevBest = KS.Progress.times[self.cfg.key] || 0;
        self.result = { win: true, stars: stars, t: -0.5, newBest: !prevBest || m.elapsed < prevBest - 0.05, saveOk: true };
        KS.Progress.record(self.cfg.key, stars, m.elapsed).then(function (ok) { if (self.result) self.result.saveOk = ok; });
        setTimeout(function () { KS.Sfx.play('win'); }, 350);
        for (var i = 0; i < 4; i++) self.fx.burst(60 + i * 90, L.conveyor.y + 80 + (i % 2) * 60, ['#f58a4b', '#ffcf4a', '#9dbb6c', '#f6b3bf', '#d8394a'], true);
      } else if (e.type === 'unlock') {
        self.fx.toast(L.W/2,L.conveyor.y+35,'解锁 '+KS.SUSHI_TYPES[e.sushiType].name+'！');
        KS.Sfx.play('go');
      } else if (e.type === 'end') {
        self.result = { win: true, endless: true, score: m.clearedCount, t: -0.1, reason: e.reason, saveOk: true };
        KS.Progress.recordEndless(m.clearedCount,m.matches,m.elapsed).then(function(ok){if(self.result)self.result.saveOk=ok});
        KS.Sfx.play('win');
        self.pointer = null;
      }
    });
  };

  // ---------------- 输入 ----------------

  P.hitButton = function (x, y) {
    for (var i = this.buttons.length - 1; i >= 0; i--) {
      var b = this.buttons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  };

  function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  P.findSushiAt = function (x, y) {
    var m = this.model, L = this.L;
    // 暂存区
    for (var b = 0; b < 5; b++) {
      var id = m.buffer[b];
      if (id !== null && inRect(x, y, L.bufferSlots[b])) return id;
    }
    // 传送带：取最近的可拿取寿司（热区比盘子略大）
    var best = -1, bd = Infinity, tmp = {};
    var R = Math.max(24, this.plateK * 50 * 1.18);
    for (var i = 0; i < m.belt.length; i++) {
      var sid = m.belt[i];
      if (!m.isPickableOnBelt(sid)) continue;
      this.path.at(m.sushi[sid].s, tmp);
      var dx = x - tmp.x, dy = (y - (tmp.y - 6)) * 1.15;
      var d = dx * dx + dy * dy;
      if (d < R * R && d < bd) { bd = d; best = sid; }
    }
    return best;
  };

  P.onDown = function (x, y) {
    var btn = this.hitButton(x, y);
    if (btn) { this.pressed = btn.id; return; }
    var m = this.model;
    if (this.tutorial && m.status === 'ready') {
      // 教学卡：点一下就开始
      this.tutorial = false; this.readyT = 1.0;
      KS.Progress.markTutorial();
      return;
    }
    if (m.status !== 'playing' || this.app.paused) return;
    var id = this.findSushiAt(x, y);
    if (id < 0) return;
    this.pointer = { x: x, y: y, sx: x, sy: y, id: id, moved: false, t0: this.time };
    if (m.pick(id)) {
      var v = this.views[id];
      this.fx.sparkle(v.x, v.y - 20, 4);
      this.app.debugLog && this.app.debugLog('pick #' + id);
    } else this.pointer = null;
  };

  P.onMove = function (x, y) {
    if (!this.pointer) return;
    this.pointer.x = x; this.pointer.y = y;
    if (Math.hypot(x - this.pointer.sx, y - this.pointer.sy) > TAP_SLOP) this.pointer.moved = true;
  };

  /** 拖放目标：按寿司显示位置判断（显示在手指上方） */
  P.dropTarget = function () {
    var p = this.pointer, L = this.L;
    if (!p) return null;
    var x = p.x, y = p.y - HOLD_LIFT_Y * 0.6;
    for (var t = 0; t < 3; t++) if (inRect(x, y, L.trays[t].hit)) return { kind: 'tray', index: t };
    if (inRect(x, y, L.bufferHit) || inRect(p.x, p.y, L.bufferHit)) {
      var best = 0, bd = Infinity;
      for (var b = 0; b < 5; b++) { var d = Math.abs(L.bufferSlots[b].cx - x); if (d < bd) { bd = d; best = b; } }
      return { kind: 'buffer', index: best };
    }
    return null;
  };

  P.onUp = function (x, y) {
    var btn = this.hitButton(x, y);
    if (this.pressed) {
      if (btn && btn.id === this.pressed) { KS.Sfx.play('click'); btn.action(); }
      this.pressed = null;
      return;
    }
    var p = this.pointer, m = this.model;
    if (!p) return;
    p.x = x; p.y = y;
    if (m.held) {
      if (!p.moved) m.autoPlaceHeld();
      else m.drop(this.dropTarget());
    }
    this.pointer = null;
  };

  P.onCancel = function () {
    if (this.model.held) this.model.cancelHeld();
    this.pointer = null; this.pressed = null;
  };

  P.onKey = function (k) {
    if (k === 'r' || k === 'R') this.app.startGame(this.cfg, this.seed);
  };

  // ---------------- 绘制 ----------------

  P.drawSushi = function (ctx, type, x, y, k, sx, sy, rot, alpha) {
    Art.drawSprite(ctx, Art.sushiSprite(type), x, y - 22 * k + 3 * k, k, sx, sy, rot, alpha);
  };

  P.drawPlate = function (ctx, type, x, y, k, alpha) {
    Art.drawSprite(ctx, type ? Art.plateSprite(type) : Art.plainPlateSprite(), x, y - 22 * k, k, 1, 1, 0, alpha);
  };

  P.render = function (ctx) {
    var L = this.L, m = this.model, self = this;
    ctx.drawImage(this.staticLayer, 0, 0, L.W, L.H);
    // 菜单牌动态数字
    /* 地图上不重复显示种类数字 */
    // 履带纹
    Art.beltSlats(ctx, this.path, this.beltW, m.beltOffset, 15 * this.path.scale, this.screenRange);

    // ---- 传送带上的盘子与寿司（按 y 排序，下方的遮挡上方的）----
    var items = [], tmp = {};
    for (var i = 0; i < m.belt.length; i++) {
      var sh = m.sushi[m.belt[i]];
      if (this.screenRange && (sh.s < this.screenRange.start - 60 || sh.s > this.screenRange.end + 60)) continue;
      this.path.at(sh.s, tmp);
      items.push({ y: tmp.y, x: tmp.x, sh: sh, held: sh.loc === 'held' });
    }
    this.ghosts.forEach(function (g) {
      if (g.s == null) return;
      self.path.at(g.s, tmp);
      items.push({ y: tmp.y, x: tmp.x, ghost: g });
    });
    items.sort(function (a, b) { return a.y - b.y; });
    items.forEach(function (it) {
      if (it.ghost) {
        var gf = it.ghost.life / 0.35;
        self.drawPlate(ctx, null, it.x, it.y, it.ghost.k * (1 - gf * 0.3), 1 - gf);
        return;
      }
      var v = self.views[it.sh.id];
      // 画面内的入口/出口：盘子在门帘下淡入/淡出，不会凭空出现或消失
      var fade = 1, s0 = it.sh.s;
      if (self.innerEnd && s0 > self.path.length - 30) fade = KS.clamp((self.path.length - s0) / 22, 0, 1);
      if (self.innerStart && s0 < 30) fade = Math.min(fade, KS.clamp(s0 / 22, 0, 1));
      var fk = 0.55 + 0.45 * fade;
      self.drawPlate(ctx, it.sh.type, it.x, it.y, self.plateK * fk, (it.held ? 0.9 : 1) * fade);
      if (it.held || v.fl) return;
      var sk = v.shake > 0 ? Math.sin(v.shake * 60) * 3 * (v.shake / 0.35) : 0;
      var sq = v.land < 0.5 ? Ease.wobble(v.land, 30, 9) * 0.16 : 0;
      self.drawSushi(ctx, it.sh.type, it.x + sk, it.y, self.plateK * 0.84 * fk, 1 + sq, 1 - sq, 0, fade);
    });
    ctx.drawImage(this.gateLayer, 0, 0, L.W, L.H);
    this.drawRefill(ctx);

    // ---- 托盘 ----
    var drag = this.pointer && m.held && this.pointer.moved ? this.dropTarget() : null;
    var heldType = m.held ? m.sushi[m.held.id].type : null;
    for (var t = 0; t < 3; t++) this.drawTray(ctx, t, drag, heldType);

    // ---- 暂存区 ----
    if (drag && drag.kind === 'buffer') {
      var full = m.freeBufferSlot() < 0;
      ctx.save();
      Art.roundRect(ctx, L.buffer.x - 3, L.buffer.y - 3, L.buffer.w + 6, L.buffer.h + 6, 20);
      ctx.lineWidth = 4; ctx.strokeStyle = full ? 'rgba(220,80,60,0.8)' : 'rgba(120,190,90,0.9)'; ctx.stroke();
      ctx.restore();
    }
    this.ghosts.forEach(function (g) {
      if (g.s != null) return;
      var gf = g.life / 0.35;
      self.drawPlate(ctx, null, g.x, g.y, g.k, 1 - gf);
    });
    for (var b = 0; b < 5; b++) {
      var bid = m.buffer[b];
      if (bid === null) continue;
      var bv = this.views[bid];
      if (bv.fl) continue;
      var bs = m.sushi[bid];
      var bsk = bv.shake > 0 ? Math.sin(bv.shake * 60) * 3 : 0;
      var bsq = bv.land < 0.5 ? Ease.wobble(bv.land, 30, 9) * 0.18 : 0;
      this.drawPlate(ctx, bs.type, bv.x + bsk, bv.y, this.bufPlateK);
      this.drawSushi(ctx, bs.type, bv.x + bsk, bv.y, this.bufK, 1 + bsq, 1 - bsq);
    }

    // ---- 飞行中的寿司（最上层）----
    for (var f = 0; f < m.sushi.length; f++) {
      var fv = this.views[f];
      if (!fv.fl || !fv.show) continue;
      var fs = m.sushi[f];
      ctx.save();
      ctx.fillStyle = 'rgba(80,45,20,0.18)';
      Art.ellipse(ctx, fv.x, fv.y + 14, 22 * fv.k / 0.6, 6 * fv.k / 0.6); ctx.fill();
      ctx.restore();
      if (fv.plateNow > 0.01) this.drawPlate(ctx, fs.type, fv.x, fv.y, fv.plateNow);
      this.drawSushi(ctx, fs.type, fv.x, fv.y, fv.k, 1, 1, fv.flRot || 0);
    }

    // ---- 手里的寿司 ----
    if (m.held) {
      var hv = this.views[m.held.id], hs = m.sushi[m.held.id];
      var lift = Ease.outBack(Math.min(1, hv.lift));
      ctx.save();
      ctx.fillStyle = 'rgba(70,40,20,' + (0.25 - lift * 0.08).toFixed(3) + ')';
      Art.ellipse(ctx, hv.x + 4, hv.y + 18 + lift * 14, 26 * (1 - lift * 0.15), 8 * (1 - lift * 0.15)); ctx.fill();
      ctx.restore();
      var st = 1 + Math.min(0.12, Math.abs(hv.vy) * 0.00012);
      var hk = hv.k * (0.85 + 0.15 * lift);
      this.drawSushi(ctx, hs.type, hv.x, hv.y - lift * 6, hk, 1 / Math.sqrt(st), st, hv.rot);
    }

    this.fx.draw(ctx);
    this.drawHint(ctx);
    this.drawHUD(ctx);
    this.drawOverlay(ctx);
  };

  /** 补货加速提示：在入口旁显示“加速上菜” */
  P.drawRefill = function (ctx) {
    var m = this.model;
    var a = KS.clamp((m.speedMul - 1.12) / 0.25, 0, 1);
    this.refillA = (this.refillA || 0) + (a - (this.refillA || 0)) * 0.15;
    if (this.refillA < 0.02 || !this.screenRange) return;
    var tmp = this.path.at(this.screenRange.start + 70, {});
    var nx = -tmp.ty, ny = tmp.tx;
    if (ny > 0) { nx = -nx; ny = -ny; }
    var d = this.beltW / 2 + this.wallW + 4;
    var x = KS.clamp(tmp.x + nx * d + 28, 60, this.L.W - 60), y = Math.max(this.L.conveyor.y + 12, tmp.y + ny * d - 4);
    ctx.save();
    ctx.globalAlpha = this.refillA;
    var bob = Math.sin(this.time * 8) * 1.5;
    ctx.font = Art.font(12);
    var w = ctx.measureText('加速上菜').width + 34;
    Art.roundRect(ctx, x - w / 2, y - 12 + bob, w, 22, 11);
    ctx.fillStyle = '#c74a3f'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    // 小箭头
    ctx.strokeStyle = '#fff3dc'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (var i = 0; i < 2; i++) {
      var ax = x - w / 2 + 10 + i * 5 + ((this.time * 12) % 4);
      ctx.beginPath(); ctx.moveTo(ax, y - 5 + bob); ctx.lineTo(ax + 4, y - 1 + bob); ctx.lineTo(ax, y + 3 + bob); ctx.stroke();
    }
    Art.text(ctx, '加速上菜', x + 7, y - 1 + bob, 12, '#fff6e6');
    ctx.restore();
  };

  P.drawDecorDynamic = function (ctx) {
    var m = this.model;
    var self = this;
    (this.decor || []).forEach(function (d) {
      if (d.kind !== 'menu') return;
      var types = self.typeList();
      var n = types.length, iw = (d.w - 24) / n;
      types.forEach(function (tp, i) {
        var cx = d.x - d.w / 2 + 12 + iw * (i + 0.5), cy = d.y + d.h * 0.12;
        var left = 0;
        m.sushi.forEach(function (s) { if (s.type === tp && s.loc !== 'cleared') left++; });
        var k = Math.min(0.3, d.h / 240) * 1.05;
        self.drawSushi(ctx, tp, cx - 10, cy + 4, k * 0.95, 1, 1, 0, left ? 1 : 0.35);
        Art.text(ctx, left ? '×' + left : '✓', cx + 17, cy + 3, 12, left ? '#5b3a26' : '#5f9a3a');
      });
    });
  };

  P.titleText = function () { return this.cfg.name; };
  P.typeList = function () {
    return Object.keys(this.cfg.sushi).sort(function (a, b) { return KS.SUSHI_ORDER.indexOf(a) - KS.SUSHI_ORDER.indexOf(b); });
  };

  P.drawTray = function (ctx, t, drag, heldType) {
    var L = this.L, m = this.model, tr = L.trays[t], mt = m.trays[t], fx = this.trayFx[t];
    var spr = this.trays[t];
    var sx = fx.shake > 0 ? Math.sin(fx.shake * 55) * 6 * (fx.shake / 0.4) : 0;
    var bounce = fx.bounce > 0 ? 1 + Ease.wobble(0.45 - fx.bounce, 22, 7) * 0.06 : 1;
    ctx.save();
    ctx.translate(tr.cx + sx, tr.cy);
    ctx.scale(bounce, 2 - bounce);
    ctx.drawImage(spr.canvas, -spr.ox, -spr.oy, spr.w, spr.h);
    ctx.restore();
    // 拖动高亮
    var over = drag && drag.kind === 'tray' && drag.index === t;
    if (over || fx.flash > 0) {
      var okDrop = over && m.trayAccepts(t, heldType) === 'ok';
      ctx.save();
      Art.roundRect(ctx, tr.x - 5 + sx, tr.y - 5, tr.w + 10, tr.h + 10, 20);
      ctx.lineWidth = 4;
      ctx.strokeStyle = fx.flash > 0 ? 'rgba(220,70,50,' + (fx.flash / 0.4).toFixed(2) + ')' : okDrop ? 'rgba(110,185,80,0.95)' : 'rgba(220,80,60,0.85)';
      ctx.stroke();
      ctx.restore();
    }
    // 空位：虚线椭圆；托盘已锁定种类时在空位显示淡淡的种类剪影
    for (var s = 0; s < 3; s++) {
      if (mt.slots[s] !== null) continue;
      var sl = tr.slots[s];
      Art.slot(ctx, sl.x + sx, sl.y + 4, 27, 15);
      if (mt.type) this.drawSushi(ctx, mt.type, sl.x + sx, sl.y + 4, this.trayK * 0.85, 1, 1, 0, 0.2);
    }
    // 托盘中的寿司（含消除动画）
    var ids = mt.slots;
    for (var j = 0; j < 3; j++) {
      var id = ids[j];
      if (id === null) continue;
      var v = this.views[id];
      if (v.fl) continue;
      var x = v.x + sx, y = v.y, k = v.k, sqx = 1, sqy = 1, alpha = 1;
      if (v.land < 0.5) { var w = Ease.wobble(v.land, 30, 9) * 0.2; sqx = 1 + w; sqy = 1 - w; }
      if (mt.clearing) {
        var ct = mt.clearT;
        // 依次跳起 → 向中间聚拢 → 收缩（爆裂在模型 cleared 事件时触发）
        var hop = KS.clamp((ct - 0.22 - j * 0.05) / 0.2, 0, 1);
        y -= Math.sin(hop * Math.PI) * 16;
        var gather = KS.clamp((ct - 0.38) / 0.24, 0, 1), ge = Ease.inBack(gather);
        x = KS.lerp(x, tr.cx, ge);
        y = KS.lerp(y, tr.cy - 8, ge);
        k *= 1 + 0.12 * Math.sin(hop * Math.PI) - 0.35 * ge;
        alpha = 1 - gather * 0.3;
        if (gather > 0) { sqx = 1 + 0.15 * gather; sqy = 1 - 0.1 * gather; }
      }
      var ssh = v.shake > 0 ? Math.sin(v.shake * 60) * 3 : 0;
      ctx.save();
      ctx.fillStyle = 'rgba(110,70,30,0.14)';
      Art.ellipse(ctx, x + ssh, y + 15, 24 * k / 0.6, 5 * k / 0.6); ctx.fill();
      ctx.restore();
      this.drawSushi(ctx, m.sushi[id].type, x + ssh, y, k, sqx, sqy, 0, alpha);
    }
    if (mt.clearing && mt.clearT > 0.25) {
      // 聚拢时的光晕
      var gl = KS.clamp((mt.clearT - 0.25) / 0.37, 0, 1);
      ctx.save();
      var g = ctx.createRadialGradient(tr.cx, tr.cy - 6, 0, tr.cx, tr.cy - 6, 70);
      g.addColorStop(0, 'rgba(255,245,200,' + (0.7 * gl).toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,245,200,0)');
      ctx.fillStyle = g; ctx.fillRect(tr.cx - 80, tr.cy - 70, 160, 130);
      ctx.restore();
    }
  };

  P.drawHint = function (ctx) {
    var m = this.model;
    if (this.hintDone || m.status !== 'playing' || m.held) return;
    if (m.elapsed < 0.8) return;
    // 指向最靠近屏幕中部的可拿取寿司
    var best = -1, bd = Infinity, tmp = {};
    for (var i = 0; i < m.belt.length; i++) {
      var id = m.belt[i];
      if (!m.isPickableOnBelt(id)) continue;
      this.path.at(m.sushi[id].s, tmp);
      var d = Math.abs(tmp.x - this.L.W * 0.45);
      if (d < bd) { bd = d; best = id; }
    }
    if (best < 0) return;
    this.path.at(m.sushi[best].s, tmp);
    var ph = (this.time * 1.6) % 1;
    var press = ph > 0.45 && ph < 0.7;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = 'rgba(255,250,235,' + (1 - ph).toFixed(2) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(tmp.x, tmp.y - 6, 20 + ph * 22, 0, Math.PI * 2); ctx.stroke();
    Art.hand(ctx, tmp.x + 8, tmp.y + 4 - (press ? 0 : 6), 1.05, press);
    ctx.restore();
  };

  P.drawHUD = function (ctx) {
    var L=this.L,m=this.model,self=this;
    this.buttons=[];
    var back={id:'back',x:L.btnBack.x,y:L.btnBack.y,w:L.btnBack.w,h:L.btnBack.h,
      action:function(){self.onCancel();self.app.showMenu(self.cfg.mode==='free'?'free':'home')}};
    var restart={id:'restart',x:L.btnRestart.x,y:L.btnRestart.y,w:L.btnRestart.w,h:L.btnRestart.h,
      action:function(){self.app.startGame(self.cfg,self.seed)}};
    var pause={id:'pause',x:L.btnPause.x,y:L.btnPause.y,w:L.btnPause.w,h:L.btnPause.h,
      action:function(){self.onCancel();self.app.paused=!self.app.paused}};
    var sound={id:'sound',x:L.btnSound.x,y:L.btnSound.y,w:L.btnSound.w,h:L.btnSound.h,
      action:function(){KS.Sfx.toggle()}};
    this.buttons.push(back,restart,pause,sound);
    Art.button(ctx,back,'back',this.pressed==='back');
    Art.button(ctx,restart,'restart',this.pressed==='restart');
    Art.button(ctx,pause,'pause',this.pressed==='pause');
    Art.button(ctx,sound,'sound',this.pressed==='sound',KS.Sfx.muted);
    // 正向计时：教学与自由图没有超时失败；无尽在十分钟自然结算。
    var t=m.endless?Math.max(0,Math.ceil(m.timeLeft)):Math.floor(m.elapsed);
    var clock=Math.floor(t/60)+':'+('0'+t%60).slice(-2);
    Art.pill(ctx,L.clockPill);
    Art.text(ctx,clock,L.W/2,L.clockPill.y+L.clockPill.h/2+1,18,'#5b3a26');
    if(m.endless){
      // 小而清楚的成绩，不和寿司画面抢位置
      Art.text(ctx,'已消除 '+m.clearedCount,L.W/2,L.conveyor.y+7,14,'#764a2c');
    }
  };

  P.drawOverlay = function (ctx) {
    var L=this.L,m=this.model,self=this;
    var cy=L.conveyor.y+L.conveyor.h/2;
    // 新手教学首次打开时只给三个最基础规则。
    if(this.tutorial && m.status==='ready'){
      ctx.save();ctx.fillStyle='rgba(59,35,18,.43)';ctx.fillRect(0,0,L.W,L.H);
      Art.roundRect(ctx,43,cy-106,304,213,22);ctx.fillStyle='#fff6e5';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
      Art.banner(ctx,L.W/2,cy-100,'新手教学',160,45);
      Art.text(ctx,'点寿司，自动放进托盘',L.W/2,cy-42,16,'#5a3927');
      Art.text(ctx,'三个相同寿司就消除',L.W/2,cy-6,16,'#5a3927');
      Art.text(ctx,'放不下？用下方五格暂存',L.W/2,cy+30,15,'#7c5740');
      Art.text(ctx,'轻触开始',L.W/2,cy+79,18,'#c74a3f');ctx.restore();return;
    }
    if(m.status==='ready' || (m.status==='playing' && m.elapsed<.45)){
      var t=m.status==='ready'?this.readyT:1.25+m.elapsed;
      var alpha=t<1.25?1:1-(t-1.25)/.45;
      ctx.save();ctx.globalAlpha=KS.clamp(alpha,0,1);
      ctx.fillStyle='rgba(72,40,20,.25)';ctx.fillRect(0,L.conveyor.y,L.W,L.conveyor.h);
      Art.banner(ctx,L.W/2,cy,t<1.0?this.cfg.name:'开始！',190,54,t<1?'#c74a3f':'#7aa84a');
      ctx.restore();
    }
    // 暂停：可以继续、提前结算（无尽）、或回到首页。
    if(this.app.paused && !this.result){
      ctx.save();ctx.fillStyle='rgba(51,31,16,.64)';ctx.fillRect(0,0,L.W,L.H);
      Art.roundRect(ctx,53,cy-156,284,305,25);ctx.fillStyle='#fff4df';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
      Art.banner(ctx,L.W/2,cy-143,'已暂停',150,50);ctx.restore();
      var btns=[{label:'继续游戏',primary:true,action:function(){self.app.paused=false}}];
      if(m.endless)btns.push({label:'结束本局 · 结算',action:function(){self.app.paused=false;m.finishEndless('manual')}});
      btns.push({label:'返回首页',action:function(){self.app.paused=false;self.onCancel();self.app.showMenu('home')}});
      btns.forEach(function(b,i){b.id='pause-'+i;b.x=L.W/2-110;b.y=cy-65+i*65;b.w=220;b.h=48;self.buttons.push(b);KS.Menu.drawButton(ctx,b,b.label,b.primary,self.pressed===b.id)});
      return;
    }
    if(!this.result||this.result.t<0)return;
    var r=this.result,cfg=this.cfg,t=r.t;
    ctx.save();
    ctx.fillStyle='rgba(45,28,18,'+(.55*KS.clamp(t/.25,0,1)).toFixed(3)+')';ctx.fillRect(0,0,L.W,L.H);
    var pw=310,ph=345,px=L.W/2,py=L.H/2;
    ctx.translate(px,py);ctx.scale(Ease.outBack(KS.clamp(t/.38,0,1)),Ease.outBack(KS.clamp(t/.38,0,1)));
    Art.roundRect(ctx,-pw/2+3,-ph/2+5,pw,ph,24);ctx.fillStyle='rgba(40,24,10,.4)';ctx.fill();
    Art.roundRect(ctx,-pw/2,-ph/2,pw,ph,24);ctx.fillStyle='#fff5e0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
    Art.banner(ctx,0,-ph/2+1,r.endless?'本局完成！':'完成！',180,52);
    if(r.endless){
      Art.text(ctx,'已消除',0,-105,16,'#9b7350');
      Art.text(ctx,String(r.score),0,-60,52,'#c74a3f');
      Art.text(ctx,'颗寿司 · '+m.matches+' 组',0,-21,17,'#65432b');
      Art.text(ctx,'用时 '+formatClock(m.elapsed),0,9,14,'#87664b');
      if(KS.Progress.endlessBest)Art.text(ctx,'最佳纪录 '+KS.Progress.endlessBest+' 颗',0,39,14,'#7a954e');
    } else {
      for(var i=0;i<3;i++)Art.star(ctx,(i-1)*65,-80-(i===1?8:0),i===1?28:24,i<r.stars);
      Art.text(ctx,'用时 '+formatClock(m.elapsed),0,-11,21,'#593b29');
      Art.text(ctx,r.newBest?'新纪录！':'再试一次，冲击三星',0,25,15,r.newBest?'#be6040':'#8c7259');
    }
    ctx.restore();
    var buttons=r.endless?[{label:'再玩一次',primary:true,action:function(){self.app.startGame(cfg)}},{label:'返回首页',action:function(){self.app.showMenu('home')}}]:
      [{label:'再玩一次',primary:true,action:function(){self.app.startGame(cfg)}},{label:'返回选图',action:function(){self.app.showMenu(cfg.mode==='free'?'free':'home')}}];
    if(t<.35)return;
    buttons.forEach(function(b,i){b.id='result-'+i;b.x=px-112;b.y=py+63+i*57;b.w=224;b.h=45;self.buttons.push(b);KS.Menu.drawButton(ctx,b,b.label,b.primary,self.pressed===b.id)});
  };

  function formatClock(seconds){var t=Math.floor(seconds);return Math.floor(t/60)+':'+('0'+t%60).slice(-2)}

  KS.PlayScene = PlayScene;
})(globalThis.KS);

</script>
<script>
/*
 * 入口：画布适配、主循环、输入分发、场景切换、调试接口。
 * URL 参数：
 *   ?level=1..3        直接进入主线某关
 *   ?map=free-u|free-z|free-double   直接进入自由地图（无效值回到首页）
 *   ?seed=123          调试：覆盖地图的固定 seed（正常游玩不会出现）
 *   ?debug=1     显示开发者面板（数量守恒断言、帧率）
 *   ?manual=1    手动时钟（自动化录屏用，由 KSDebug.step 驱动）
 */
(function (KS) {
  'use strict';
  var params = new URLSearchParams(location.search);
  var DEBUG = params.get('debug') === '1';
  var MANUAL = params.get('manual') === '1';

  var App = {
    canvas: null, ctx: null, layout: null, scene: null,
    pixelRatio: 1, paused: false, safeTop: 0, safeBottom: 0,
    hostTop: 0, hostBottom: 0, guard: false,
    debugSeed: params.get('seed') != null && isFinite(parseInt(params.get('seed'), 10)) ? parseInt(params.get('seed'), 10) : undefined,
    invariantErrors: 0, lastInvariant: [],
    perf: { frames: [], work: [] }
  };
  KS.App = App;

  App.init = function () {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.measureSafe();
    this.resize();
    window.addEventListener('resize', this.onResize.bind(this));
    window.addEventListener('orientationchange', this.onResize.bind(this));
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && App.scene instanceof KS.PlayScene && App.scene.model.status === 'playing') {
        App.scene.onCancel(); App.paused = true;
      }
    });
    this.bindInput();
    this.bindBack();
    var lv = parseInt(params.get('level'), 10);
    var mapKey = params.get('map');
    var mapCfg = mapKey ? KS.findMap(mapKey) : null;
    if (lv >= 1 && lv <= KS.LEVELS.length) this.startLevel(lv - 1);
    else if (mapCfg) this.startGame(mapCfg);
    else this.showMenu('home');
    this.loadBestStars();
    this.refreshHostInsets();
    this.last = performance.now();
    if (!MANUAL) requestAnimationFrame(this.loop.bind(this));
    else this.frame(0);
    var boot = document.getElementById('boot');
    if (boot) boot.remove();
  };

  App.measureSafe = function () {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;padding-top:0;padding-bottom:0;padding-top:var(--safe-area-inset-top, env(safe-area-inset-top, 0px));padding-bottom:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))';
    document.body.appendChild(d);
    var cs = getComputedStyle(d);
    this.safeTop = Math.max(parseFloat(cs.paddingTop) || 0, this.hostTop || 0);
    this.safeBottom = Math.max(parseFloat(cs.paddingBottom) || 0, this.hostBottom || 0);
    d.remove();
  };

  App.refreshHostInsets = function () {
    if (!KS.Platform) return;
    KS.Platform.windowInfo().then(function (info) {
      if (!info || !App.canvas) return;
      var safe = info.safeArea || {};
      var top = Math.max(0, Number(safe.top) || 0);
      var h = Number(info.windowHeight) || 0;
      var bottom = h && isFinite(Number(safe.bottom)) ? Math.max(0, h - Number(safe.bottom)) : 0;
      var buttons = info.menuButtons || {};
      ['back', 'me', 'share'].forEach(function (key) {
        var b = buttons[key];
        if (b && Number(b.top) < 120 && isFinite(Number(b.bottom))) {
          top = Math.max(top, Number(b.bottom) + 5);
        }
      });
      top = Math.min(96, top);
      bottom = Math.min(72, bottom);
      if (Math.abs(top - App.hostTop) < 2 && Math.abs(bottom - App.hostBottom) < 2) return;
      App.hostTop = top;
      App.hostBottom = bottom;
      App.measureSafe();
      App.resize();
      if (App.scene) App.scene.relayout();
    });
  };

  App.onResize = function () {
    clearTimeout(this._rt);
    var self = this;
    this._rt = setTimeout(function () {
      self.measureSafe(); self.resize(); if (self.scene) self.scene.relayout();
      self.refreshHostInsets();
    }, 60);
  };

  App.resize = function () {
    var vw = window.innerWidth, vh = window.innerHeight;
    this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2.5);
    this.canvas.width = Math.round(vw * this.pixelRatio);
    this.canvas.height = Math.round(vh * this.pixelRatio);
    this.canvas.style.width = vw + 'px';
    this.canvas.style.height = vh + 'px';
    this.layout = KS.Layout.compute(vw, vh, this.safeTop, this.safeBottom);
  };

  /** 菜单：view = 'home' 首页 | 'main' 经典闯关列表 | 'free' 自由选图列表 */
  App.showMenu = function (view) {
    this.paused = false;
    this.scene = new KS.MenuScene(this, view || 'home');
    if (this.scene.view !== 'home') this.ensureGuard();
  };

  /** 统一开局入口：cfg 为主线关卡或自由地图配置；seed 仅调试覆盖 */
  App.startGame = function (cfg, seed) {
    if (!cfg) { this.showMenu('home'); return; }
    this.paused = false;
    if (seed === undefined) seed = this.debugSeed;
    this.scene = new KS.PlayScene(this, cfg, seed);
    this.ensureGuard();
    this.debugLog('开始 ' + cfg.key + ' seed=' + this.scene.model.seed);
  };

  /** 兼容 V1：按主线下标开局 */
  App.startLevel = function (index, seed) { this.startGame(KS.LEVELS[index], seed); };
  App.startMap = function (key, seed) { this.startGame(KS.findMap(key), seed); };
  App.startEndless = function(seed){this.startGame(KS.ENDLESS,seed)};

  // ---------- 返回键 / 系统返回手势 ----------
  // 不在首页时保留一条 history 记录；系统返回会触发 popstate，游戏内返回上一级而不是直接退出。
  App.ensureGuard = function () {
    if (this.guard || MANUAL || !window.history || typeof history.pushState !== 'function') return;
    try { history.pushState({ ks: 1 }, ''); this.guard = true; } catch (e) { /* ignore */ }
  };
  App.bindBack = function () {
    var self = this;
    window.addEventListener('popstate', function () { self.guard = false; self.back(); });
  };
  /** 返回上一级：对局 → 所属列表；列表 → 首页 */
  App.back = function () {
    var sc = this.scene;
    if (sc instanceof KS.PlayScene) { sc.onCancel(); this.showMenu(sc.cfg.mode === 'free' ? 'free' : 'home'); }
    else if (sc instanceof KS.MenuScene && sc.view !== 'home') this.showMenu('home');
  };

  App.allMapKeys = function () {
    return KS.LEVELS.concat(KS.FREE_MAPS).map(function (c) { return c.key; });
  };
  App.loadBestStars = function () {
    return KS.Progress.load(this.allMapKeys());
  };
  App.bestStars = function () { return KS.Progress.stars; };

  App.toLogical = function (cx, cy) {
    var r = this.canvas.getBoundingClientRect(), L = this.layout;
    return { x: (cx - r.left - L.offX) / L.scale, y: (cy - r.top - L.offY) / L.scale };
  };

  App.bindInput = function () {
    var self = this, c = this.canvas, active = null;
    function down(e) {
      KS.Sfx.unlock();
      if (active !== null) return;
      active = e.pointerId;
      try { c.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
      e.preventDefault();
      /* 暂停时把点击交给暂停菜单，避免任意点击直接恢复 */
      var p = self.toLogical(e.clientX, e.clientY);
      self.scene.onDown(p.x, p.y);
    }
    function move(e) {
      if (e.pointerId !== active) return;
      e.preventDefault();
      var p = self.toLogical(e.clientX, e.clientY);
      self.scene.onMove(p.x, p.y);
    }
    function up(e) {
      if (e.pointerId !== active) return;
      active = null;
      e.preventDefault();
      var p = self.toLogical(e.clientX, e.clientY);
      self.scene.onUp(p.x, p.y);
    }
    function cancel(e) {
      if (e.pointerId !== active) return;
      active = null;
      self.scene.onCancel();
    }
    c.addEventListener('pointerdown', down);
    c.addEventListener('pointermove', move);
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', cancel);
    c.addEventListener('lostpointercapture', cancel);
    c.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    window.addEventListener('keydown', function (e) {
      if (e.key >= '1' && e.key <= String(KS.LEVELS.length)) self.startLevel(parseInt(e.key, 10) - 1);
      else if (e.key === 'Escape') self.back();
      else if (e.key === 'm' || e.key === 'M') KS.Sfx.toggle();
      else self.scene.onKey(e.key);
    });
  };

  App.loop = function (now) {
    var dt = Math.min(0.05, Math.max(0, (now - this.last) / 1000));
    this.perf.frames.push(now - this.last);
    if (this.perf.frames.length > 240) this.perf.frames.shift();
    this.last = now;
    this.frame(dt);
    requestAnimationFrame(this.loop.bind(this));
  };

  App.frame = function (dt) {
    var t0 = performance.now();
    this.scene.update(dt);
    this._invariantTick = (this._invariantTick || 0) + 1;
    // 无尽模式十分钟可积累数百个已消除寿司，生产环境每 15 帧核验一次；调试模式每帧核验。
    if (this.scene.model && (DEBUG || this._invariantTick % 15 === 0)) {
      var errs = this.scene.model.checkInvariants();
      if (errs.length) {
        this.invariantErrors++;
        if (this.invariantErrors < 5) console.error('[不变量] ', errs);
        this.lastInvariant = errs;
      }
    }
    this.render();
    this.perf.work.push(performance.now() - t0);
    if (this.perf.work.length > 240) this.perf.work.shift();
  };

  App.render = function () {
    var ctx = this.ctx, L = this.layout, pr = this.pixelRatio;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (L.offX > 0.5 || L.offY > 0.5) {
      ctx.fillStyle = '#d9b48a';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }
    ctx.setTransform(L.scale * pr, 0, 0, L.scale * pr, L.offX * pr, L.offY * pr);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, L.W, L.H); ctx.clip();
    this.scene.render(ctx);
    ctx.restore();
    if (DEBUG) this.drawDebug(ctx);
  };

  App.drawDebug = function (ctx) {
    var s = this.scene, L = this.layout;
    var lines = [];
    var fr = this.perf.frames, wk = this.perf.work;
    var avg = function (a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 0; };
    lines.push('FPS ' + (1000 / (avg(fr) || 16.7)).toFixed(0) + '  渲染 ' + avg(wk).toFixed(2) + 'ms');
    if (s.model) {
      var c = s.model.counts();
      lines.push('带' + c.belt + ' 厨' + c.kitchen + ' 手' + c.held + ' 盘' + c.tray + ' 暂' + c.buffer + ' 消' + c.cleared + ' = ' + (c.belt + c.kitchen + c.held + c.tray + c.buffer + c.cleared) + '/' + c.total);
      lines.push(this.invariantErrors ? '不变量错误 ' + this.invariantErrors + ': ' + this.lastInvariant[0] : '不变量 ✓  seed ' + s.model.seed);
    }
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(4, L.H - 16 - lines.length * 14, 300, lines.length * 14 + 8);
    ctx.font = '11px monospace'; ctx.fillStyle = this.invariantErrors ? '#ff8080' : '#b0ffb0';
    lines.forEach(function (ln, i) { ctx.fillText(ln, 10, L.H - 14 - (lines.length - 1 - i) * 14 + 2); });
    ctx.restore();
  };

  App.debugLog = function (msg) { if (DEBUG) console.log('[KS] ' + msg); };

  // ---------- 自动化测试接口 ----------
  window.KSDebug = {
    app: App,
    step: function (n, dt) { for (var i = 0; i < (n || 1); i++) App.frame(dt || 1 / 30); },
    model: function () { return App.scene.model; },
    scene: function () { return App.scene; },
    /** 寿司在页面上的 CSS 像素坐标（用于真实触摸点击） */
    screenPos: function (id) {
      var sc = App.scene, sh = sc.model.sushi[id], t = {};
      sc.anchorOf(sh, t);
      var L = App.layout, r = App.canvas.getBoundingClientRect();
      return { x: r.left + L.offX + t.x * L.scale, y: r.top + L.offY + (t.y - 6) * L.scale };
    },
    toScreen: function (x, y) {
      var L = App.layout, r = App.canvas.getBoundingClientRect();
      return { x: r.left + L.offX + x * L.scale, y: r.top + L.offY + y * L.scale };
    },
    layout: function () { return App.layout; },
    perf: function () {
      var f = App.perf.frames.slice().sort(function (a, b) { return a - b; }), w = App.perf.work.slice().sort(function (a, b) { return a - b; });
      var avg = function (a) { return a.reduce(function (x, y) { return x + y; }, 0) / (a.length || 1); };
      return { frameAvg: avg(f), frameP95: f[Math.floor(f.length * 0.95)] || 0, workAvg: avg(w), workP95: w[Math.floor(w.length * 0.95)] || 0, n: f.length };
    },
    resetPerf: function () { App.perf.frames = []; App.perf.work = []; },
    invariantErrors: function () { return App.invariantErrors; },
    start: function (i, seed) { App.startLevel(i, seed); },
    startMap: function (key, seed) { App.startMap(key, seed); },
    startEndless: function(seed) { App.startEndless(seed); },
    menu: function (view) { App.showMenu(view); },
    back: function () { App.back(); },
    progress: function () { return KS.Progress; }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { App.init(); });
  else App.init();
})(globalThis.KS);

</script>
</body>
